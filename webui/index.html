  const acct = '<div class="rs-stats"><div><div class="k">Equity</div><div class="v">$' + N(a.equity, 0) + '</div><div class="sub">' + (a.equity_entered ? 'as you entered it' : 'DEFAULT, not entered') + '</div></div>' +
    '<div><div class="k">Planned open risk</div><div class="v">$' + N(rk.planned_total, 0) + '</div><div class="sub">budget $' + N(rk.budget, 0) + '</div></div>' +
    '<div><div class="k">Left in budget</div><div class="v">$' + N(rk.remaining, 0) + '</div><div class="sub">' + (rk.lockout ? 'DAILY LOCKOUT' : 'no lockout') + '</div></div></div>' +
    (rk.reasons.length ? '<ul class="in-list">' + li(rk.reasons) + '</ul>' : '') +
    (rk.scenarios || []).map(x => '<div class="sub">Scenario: ' + esc(x.label) + ' → worst case −$' + N(x.worst_case_loss, 0) + (x.covered_by_oco ? ' (one side cancels the other in the paper simulator)' : '') + '. ' + esc(x.note || '') + '</div>').join('') +
    '<div class="sub">' + esc(a.note) + ' ' + esc(g.oco.note) + '</div>';
  const pr = g.broker.profile, lm = g.broker.limits;
  const field = (id, label, v) => '<label>' + label + '<input id="bp_' + id + '" value="' + esc(v) + '"></label>';
  const brokerHtml = '<div class="note"><b>' + (g.broker.verified ? 'Broker profile saved.' : 'Placeholder broker values.') + '</b> ' + esc(g.broker.note) + ' ' + esc(g.stop_limit.note) + '</div>' +
    '<div class="in-form">' + field('spread', 'Spread', pr.spread) + field('slippage', 'Slippage per side', pr.slippage) + field('commission_per_lot', 'Commission per lot', pr.commission_per_lot) + field('stops_level_points', 'Stops level (points)', pr.stops_level_points) +
    field('tick_size', 'Tick size', pr.tick_size) + field('min_lot', 'Min lot', pr.min_lot) + field('lot_step', 'Lot step', pr.lot_step) + field('units_per_lot', 'Units per lot', pr.units_per_lot) + '</div>' +
    '<div class="in-form">' + field('l_risk_pct', 'Risk per setup %', lm.risk_pct) + field('l_max_aggregate_risk_pct', 'Total planned risk %', lm.max_aggregate_risk_pct) + field('l_daily_loss_pct', 'Daily loss lockout %', lm.daily_loss_pct) + field('l_min_net_rr', 'Min net R:R', lm.min_net_rr) +
    '<button type="button" class="run" data-act="bpsave">Save broker profile</button> <span class="sub" id="bpmsg"></span></div>';
  $('#result').innerHTML = hero + meta + '<div class="in-sec">The four order types</div><div class="rs-grid">' + cards + '</div>' +
    '<div class="in-sec">Comparison</div>' + cmp + '<div class="in-sec">Charts checked</div>' + tfs + '<div class="in-sec">Account-wide risk</div>' + acct +
    '<div class="in-sec">Broker rules and limits</div>' + brokerHtml + '<div class="in-sec">Paper orders</div><div id="papers">loading…</div>' +
    '<div class="note">' + g.notes.map(esc).join(' ') + ' Paper orders are a simulation: nothing is ever sent to a broker. Not financial advice.</div>' +
    '<details class="raw"><summary>Raw data</summary><pre>' + esc(JSON.stringify(g, null, 1).slice(0, 60000)) + '</pre></details>';

  const post = async (url, body) => {
    const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'error');
    return j;
  };
  const drawPapers = j => {
    const s = j.summary;
    $('#papers').innerHTML = '<div class="sub">' + s.total + ' paper orders: ' + s.waiting + ' waiting, ' + s.open + ' open, ' + s.closed + ' closed, total ' + RR(s.total_r) + '. ' + esc(j.broker_orders) + '.</div>' +
      '<div class="in-form"><button type="button" class="chip" data-act="pupdate">Update against latest bars</button> <span class="sub" id="pmsg"></span></div>' +
      (j.orders.length ? '<table class="in-t"><tr><th>ID</th><th>Order</th><th>Entry / stop</th><th>Evidence</th><th>Order state</th><th>Position</th><th>Result</th><th></th></tr>' + j.orders.map(o =>
        '<tr><td style="word-break:break-all">' + esc(o.id) + '</td><td>' + esc(o.order_type) + (o.oco_group ? '<br><span class="sub">OCO ' + esc(o.oco_group) + '</span>' : '') + '</td><td>' + N(o.price) + ' / ' + N(o.stop) + '</td><td>' + esc(o.evidence_status || '') + '</td><td>' + esc(o.order_state.replace(/_/g, ' ')) + (o.reasons && o.reasons.length ? '<br><span class="sub">' + esc(o.reasons[0]) + '</span>' : '') + '</td><td>' + esc(o.position_state || '') + '</td><td>' + (o.r_result != null ? RR(o.r_result) : '–') + '</td><td>' +
        (['AWAITING_TRIGGER', 'TRIGGERED', 'PARTIALLY_FILLED'].includes(o.order_state) ? '<button type="button" class="chip" data-act="pcancel" data-id="' + esc(o.id) + '">cancel</button>' : '') + '</td></tr>').join('') + '</table>' : '<div class="sub">No paper orders yet.</div>') +
      (j.audit.length ? '<details class="raw"><summary>Audit trail (latest ' + j.audit.length + ')</summary><ul class="in-list">' + j.audit.map(x => '<li>' + esc((x.ts || '') + ' ' + x.order_id + ' ' + x.order_type + ': ' + x.from_state + ' → ' + x.to_state + '. ' + (x.note || '')) + '</li>').join('') + '</ul></details>' : '');
  };
  const loadPapers = () => fetch('/api/paper_orders').then(r => r.json()).then(drawPapers).catch(() => { $('#papers').textContent = 'Could not load paper orders.'; });
  loadPapers();
  $('#result').onclick = async ev => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    try {
      if (act === 'mkpaper') {
        const ack = b.dataset.v !== '1';
        if (ack && !confirm('This order type has NOT passed out-of-sample validation. Create a research paper order anyway? It is a simulation; nothing is sent to a broker.')) return;
        const j = await post('/api/paper_orders', {action: 'create', symbol: g.symbol, interval: g.interval, order_type: b.dataset.t, acknowledge_unvalidated: ack});
        drawPapers(j); $('#papers').scrollIntoView({behavior: 'smooth'});
      } else if (act === 'pupdate') { const j = await post('/api/paper_orders', {action: 'update', symbol: g.symbol, interval: g.interval}); drawPapers(j); }
      else if (act === 'pcancel') { drawPapers(await post('/api/paper_orders', {action: 'cancel', id: b.dataset.id})); }
      else if (act === 'bpsave') {
        const v = id => parseFloat($('#bp_' + id).value);
        const profile = Object.assign({}, pr, {spread: v('spread'), slippage: v('slippage'), commission_per_lot: v('commission_per_lot'), stops_level_points: v('stops_level_points'), tick_size: v('tick_size'), min_lot: v('min_lot'), lot_step: v('lot_step'), units_per_lot: v('units_per_lot'), verified: true});
        const limits = Object.assign({}, lm, {risk_pct: v('l_risk_pct'), max_aggregate_risk_pct: v('l_max_aggregate_risk_pct'), daily_loss_pct: v('l_daily_loss_pct'), min_net_rr: v('l_min_net_rr')});
        await post('/api/pending/settings', {settings: {profile, limits}});
        $('#bpmsg').textContent = 'Saved. Run Pending order research again so costs and the minimum stop distance match.';
      }
    } catch (e) { const t = $(act === 'bpsave' ? '#bpmsg' : '#pmsg') || $('#papers'); t.textContent = 'Not done: ' + e.message; }
  };
}

function renderIntel(d){
  const g = JSON.parse(d.stdout), o = g.overview, perf = g.performance, mon = g.risk_monitor;
  const N = (v, dp) => v == null ? 'n/a' : Number(v).toLocaleString('en-US', {minimumFractionDigits: dp == null ? 2 : dp, maximumFractionDigits: dp == null ? 2 : dp});
  const RR = v => v == null ? 'n/a' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + 'R';
  const when = t => t ? t.replace('T', ' ').slice(0, 16) + ' UTC' : 'n/a';
  const li = a => a.map(x => '<li>' + esc(x) + '</li>').join('');
  const tile = (k, v, s) => '<div class="g-tile"><div class="k">' + esc(k) + '</div><div class="v" style="font-size:18px">' + v + '</div><div class="s">' + s + '</div></div>';
  const pill = (t, c) => '<span class="in-pill ' + (c || '') + '">' + esc(t) + '</span>';
  const act = g.decision.action, bcls = act === 'NO TRADE' ? 'NO' : act;
  const banner = '<div class="in-banner ' + bcls + '"><div class="big">' + esc(act) + (g.decision.strategy ? ' · ' + esc(g.decision.strategy) : '') + '</div>' +
    '<div class="in-sub">' + esc(g.symbol) + ' · ' + esc(g.interval) + ' chart · checked ' + esc(when(g.checked)) + ' · live data, no simulated values anywhere on this page</div><ul>' + li(g.decision.reasons) + '</ul></div>';

  // ---------- market overview
  const al = o.alignment, q = o.data_quality, lead = q.series[0];
  const tfchips = Object.entries(al.by_tf).map(([k, v]) => '<span class="chip">' + esc(k) + ' ' + esc(String(v).replace('_', ' ')) + '</span>').join(' ');
  const age = s => s == null ? 'n/a' : s < 3600 ? Math.round(s / 60) + ' min' : (s / 3600).toFixed(1) + ' h';
  const tiles = '<div class="g-tiles">' +
    tile('Price', N(o.price), 'quote ' + esc(when(o.quote_time)) + ' · ' + age(lead.age_sec) + ' old') +
    tile('Bid / ask / spread', o.bid != null ? N(o.bid) + ' / ' + N(o.ask) : 'n/a', esc(o.bid_ask_note) + (o.spread != null ? ' · spread ' + N(o.spread) : '')) +
    tile('Regime', esc(String(o.regime).replace('_', ' ')), 'trend ' + esc(String(o.trend).replace('_', ' ')) + ' · volatility ' + esc(o.volatility)) +
    tile('Higher-timeframe alignment', esc(al.label), tfchips) +
    tile('Structure bias', esc(o.bias), 'session ' + esc(o.session) + ' · ADX ' + N(o.adx, 0) + ' · ATR ' + N(o.atr)) +
    tile('Data', esc(q.provider), 'checks ' + esc(q.status.toUpperCase()) + ' · last closed bar ' + esc(when(o.last_closed_bar)) + (o.forming_bar_excluded ? ' · forming bar excluded' : '')) + '</div>';
  const lv = (L, t) => L.length ? L.map(x => '<tr><td>' + N(x.price) + '</td><td>' + esc(x.source) + '</td><td>' + N(x.dist_atr, 1) + ' ATR</td></tr>').join('') : '<tr><td colspan="3">none</td></tr>';
  const levels = '<div class="in-grid"><div><table class="in-t"><tr><th>Resistance</th><th>Source</th><th>Away</th></tr>' + lv(o.levels.resistance) + '</table></div>' +
    '<div><table class="in-t"><tr><th>Support</th><th>Source</th><th>Away</th></tr>' + lv(o.levels.support) + '</table></div></div>';
  const S = o.structure, ev1 = e => e ? e.type.toUpperCase() + ' ' + e.dir + ' at ' + N(e.level) + ', ' + e.bars_ago + ' bars ago' : 'none yet';
  const structure = '<ul class="in-list"><li>Bias <b>' + esc(S.bias) + '</b>; last swing high ' + N(S.swing_high) + ', swing low ' + N(S.swing_low) + '</li>' +
    '<li>Last break of structure: ' + esc(ev1(S.last_bos)) + '</li><li>Last change of character: ' + esc(ev1(S.last_choch)) + '</li>' +
    '<li>Confirmed liquidity sweeps: ' + (S.sweeps.length ? S.sweeps.map(s => esc(s.source + ' ' + N(s.level) + ' (' + s.reversal + ' reversal, ' + s.bars_ago + ' bars ago' + (s.major ? ', major' : '') + ')')).join('; ') : 'none') + '</li>' +
    '<li>Open fair-value gaps nearby: ' + (S.fvg.length ? S.fvg.map(f => esc(f.dir + ' ' + N(f.lo) + '–' + N(f.hi))).join('; ') : 'none') + '</li>' +
    '<li>Order-block candidates nearby: ' + (S.order_blocks.length ? S.order_blocks.map(f => esc(f.dir + ' ' + N(f.lo) + '–' + N(f.hi))).join('; ') : 'none') + '</li></ul>';
  const evs = o.events, evl = L => L.length ? L.map(e => '<li>' + esc(when(e.utc) + ' · ' + e.name + ' · ' + e.source + ' [' + e.reliability + ']') + '</li>').join('') : '<li>none</li>';
  const events = '<div class="in-sub">Calendar: ' + evs.have + ' events stored (run <b>Update economic events</b> to refresh). Derived and manual dates should be checked.</div>' +
    '<div class="in-grid"><div><b>Upcoming high-impact (72 h)</b><ul class="in-list">' + evl(evs.upcoming) + '</ul></div><div><b>Recent (24 h)</b><ul class="in-list">' + evl(evs.recent) + '</ul></div></div>';
  const dqrows = q.series.map(r => esc(r.interval) + ': ' + esc(r.status) + (r.issues.length ? ' (' + esc(r.issues.join('; ')) + ')' : '')).join(' · ');

  // ---------- quantitative trade assessment
  const cands = [];
  const assess = g.assessments.map(a => {
    const e = a.evidence, c = a.candidate;
    let body = '<div class="in-kv"><div class="k">Out-of-sample trades</div><div>' + e.oos_n + (e.oos_n ? ' · expectancy ' + RR(e.oos_expectancy) + (e.oos_ci && e.oos_ci[0] != null ? ' (95% band ' + RR(e.oos_ci[0]) + ' to ' + RR(e.oos_ci[1]) + ')' : '') : '') + '</div>' +
      '<div class="k">Untouched holdout</div><div>' + e.holdout_n + ' trades' + (e.holdout_n ? ' · ' + RR(e.holdout_expectancy) : '') + '</div>' +
      '<div class="k">Validated</div><div>' + esc(e.validated_on ? e.validated_on.replace('T', ' ').slice(0, 16) + ' UTC' : 'never') + '</div></div>';
    if (c) {
      const i = cands.push({a, c}) - 1;
      const p = c.probability;
      body += '<table class="in-t" style="margin-top:8px"><tr><th>' + (a.decision === 'NO TRADE' ? 'Unvalidated candidate (research only)' : 'Plan') + '</th><th></th></tr>' +
        '<tr><td>Direction</td><td><b>' + esc(c.side.toUpperCase()) + '</b> · ' + esc(c.kind) + ' entry on the next bar</td></tr>' +
        '<tr><td>Confirmed trigger</td><td>' + esc(c.note) + '</td></tr>' +
        '<tr><td>Entry (reference)</td><td>' + N(c.entry) + '</td></tr>' +
        '<tr><td>Stop loss</td><td>' + N(c.stop) + ' (risk ' + N(c.risk_per_unit) + ' per unit)</td></tr>' +
        '<tr><td>Targets</td><td>' + c.targets.map((t, k) => 'T' + (k + 1) + ' ' + N(t)).join(' · ') + '</td></tr>' +
        '<tr><td>Structural invalidation</td><td>' + esc(c.invalidation) + '</td></tr>' +
        '<tr><td>Reward to risk (T1)</td><td>' + N(c.rr_gross) + ' before costs → <b>' + N(c.rr_net) + '</b> after costs (' + N(c.cost_per_unit) + ' per unit)</td></tr>' +
        '<tr><td>Estimated probability</td><td>' + (p ? '<b>' + Math.round(p.p * 100) + '%</b> target before stop; calibration range ' + (p.interval[0] != null ? Math.round(p.interval[0] * 100) + '–' + Math.round(p.interval[1] * 100) + '%' : 'n/a') + ' from ' + p.bin_n + ' past cases (model ' + esc(p.model_id) + ')' : 'none: ' + esc((a.info.find(x => x.startsWith('no calibrated')) || 'no accepted model').replace('no calibrated probability: ', ''))) + '</td></tr>' +
        '<tr><td>Expected net return</td><td>' + (c.expected_r != null ? RR(c.expected_r) + ' per trade (from out-of-sample history)' : 'n/a: only shown for validated strategies') + '</td></tr>' +
        '<tr><td>Historical sample</td><td>' + e.oos_n + ' out-of-sample trades</td></tr>' +
        '<tr><td>Out-of-sample status</td><td>' + esc(e.status) + '</td></tr>' +
        (c.sizing ? '<tr><td>Size at your risk</td><td>' + (c.sizing.fits ? N(c.sizing.lots, 4) + ' lots · risk at stop ' + usd2(c.sizing.risk_at_stop) : 'does not fit: the smallest lot risks ' + N(c.sizing.risk_at_min_lot_pct, 1) + '% of your account') + '</td></tr>' : '') +
        '</table><button type="button" class="chip" data-act="journal" data-i="' + i + '">Add to journal</button> <span class="sub" id="jmsg' + i + '"></span>';
    } else {
      body += '<p class="in-sub" style="margin-top:8px">No confirmed trigger on the last closed bar.' + (a.recent.length ? ' Recently triggered (already past): ' + a.recent.map(r => esc(r.side + ' ' + r.bars_ago + ' bars ago')).join(', ') + '.' : '') + '</p>';
    }
    if (a.blocking.length) body += '<div class="in-sub" style="margin-top:6px"><b>Why NO TRADE:</b></div><ul class="in-list">' + li(a.blocking) + '</ul>';
    if (a.info.length) body += '<ul class="in-list sub" style="color:var(--mute)">' + li(a.info) + '</ul>';
    return '<div class="in-card"><h4>' + esc(a.title) + ' ' + pill(e.status, e.validated ? 'good' : 'warn') + ' ' + pill(a.decision, a.decision === 'NO TRADE' ? 'warn' : a.decision === 'LONG' ? 'good' : 'bad') + '</h4>' + body + '</div>';
  }).join('');

  // ---------- portfolio risk monitor
  const sc = mon.status === 'OK' ? 'good' : mon.status === 'WARN' ? 'warn' : 'bad';
  const barPct = (a, b) => b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0;
  const monTiles = '<div class="g-tiles">' +
    tile('Account equity', usd2(mon.equity), esc(mon.currency) + ' · you entered this') +
    tile('Open P/L', usd2(mon.exposure.open_pnl), N(mon.open_pnl_pct, 2) + '% of equity') +
    tile('Net exposure', N(mon.exposure.net_units, 2) + ' units', 'long ' + N(mon.exposure.long_units, 2) + ' · short ' + N(mon.exposure.short_units, 2) + ' · notional ' + usd(mon.exposure.net_notional)) +
    tile('Open risk vs budget', usd2(mon.open_risk) + ' / ' + usd2(mon.risk_budget), '<div class="in-bar ' + (mon.risk_remaining < 0 ? 'bad' : barPct(mon.open_risk, mon.risk_budget) > 75 ? 'warn' : '') + '"><i style="width:' + barPct(mon.open_risk, mon.risk_budget).toFixed(0) + '%"></i></div>remaining ' + usd2(mon.risk_remaining)) +
    tile('Day P/L vs loss limit', usd2(mon.daily_pnl) + ' / −' + usd2(mon.daily_loss_limit), '<div class="in-bar ' + (mon.lockout ? 'bad' : barPct(-mon.daily_pnl, mon.daily_loss_limit) > 60 ? 'warn' : '') + '"><i style="width:' + barPct(-mon.daily_pnl, mon.daily_loss_limit).toFixed(0) + '%"></i></div>' + (mon.lockout ? 'LOCKED OUT for today' : 'room left')) +
    tile('Status', pill(mon.status, sc), mon.alerts.length + ' alert(s)') + '</div>';
  const legs = mon.positions.length ? '<table class="in-t"><tr><th>Position</th><th>Units</th><th>Entry</th><th>Stop</th><th>Target</th><th>Open P/L</th><th>To stop</th></tr>' +
    mon.positions.map(p => '<tr><td>' + esc(p.id + ' ' + p.side) + '</td><td>' + N(p.units, 2) + '</td><td>' + N(p.entry) + '</td><td>' + (p.stop != null ? N(p.stop) : '<b>none</b>') + '</td><td>' + (p.target != null ? N(p.target) : '–') + '</td><td>' + usd2(p.open_pnl) + '</td><td>' + (p.to_stop_atr != null ? N(p.to_stop_atr, 1) + ' ATR' : 'n/a') + '</td></tr>').join('') + '</table>' : '<div class="in-sub">No open positions entered.</div>';
  const scen = mon.scenarios.length ? '<table class="in-t"><tr><th>What if (read-only)</th><th>P/L</th></tr>' + mon.scenarios.map(s => '<tr><td>' + esc(s.label) + (s.note ? ' <span class="sub">(' + esc(s.note) + ')</span>' : '') + '</td><td>' + usd2(s.pnl) + '</td></tr>').join('') + '</table>' : '';
  const risk = monTiles + (mon.alerts.length ? '<ul class="in-list">' + li(mon.alerts) + '</ul>' : '') + legs + scen +
    '<details class="raw"><summary>Edit the positions, pending orders and limits this monitor uses</summary><div class="in-sub">Typed in by you; stored only in trader/portfolio.json. Nothing is sent to a broker. Run the page again to refresh the numbers.</div><div id="pfedit">loading…</div></details>';

  // ---------- performance
  let perfHtml;
  if (!perf.available) {
    perfHtml = '<div class="note">' + esc(perf.message) + ' Nothing is shown here until a real run exists; no sample numbers are ever drawn.</div>';
  } else {
    const spark = pts => {
      if (!pts || pts.length < 2) return '<span class="sub">no trades</span>';
      const xs = pts.map(p => p.t), ys = pts.map(p => p.r), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(0, ...ys), y1 = Math.max(0, ...ys);
      const X = v => 4 + (v - x0) / ((x1 - x0) || 1) * 212, Y = v => 46 - (v - y0) / ((y1 - y0) || 1) * 40;
      return '<svg viewBox="0 0 220 50" width="220" height="50"><line x1="0" x2="220" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" stroke="var(--line)"/><polyline fill="none" stroke="var(--accent)" stroke-width="1.6" points="' + pts.map(p => X(p.t).toFixed(1) + ',' + Y(p.r).toFixed(1)).join(' ') + '"/></svg>';
    };
    const rows = Object.entries(perf.strategies).map(([k, s]) => {
      const o2 = s.oos, ho = s.holdout || {};
      return '<tr><td><b>' + esc(k.replace(/_/g, ' ')) + '</b><br>' + pill(s.status, s.status.startsWith('VALIDATED') ? 'good' : 'warn') + '</td><td>' + (o2.n || 0) + '</td><td>' + (o2.n ? RR(o2.expectancy) + '<br><span class="sub">' + (o2.ci95 && o2.ci95[0] != null ? RR(o2.ci95[0]) + ' to ' + RR(o2.ci95[1]) : 'band n/a') + '</span>' : 'n/a') + '</td><td>' +
        (o2.n && o2.profit_factor ? N(o2.profit_factor) : 'n/a') + '</td><td>' + (o2.n ? N(o2.max_dd_r, 1) + 'R' : 'n/a') + '</td><td>' + (ho.n ? ho.n + ' · ' + RR(ho.expectancy) : '0') + '</td><td>' + spark(s.equity) + '</td></tr>';
    }).join('');
    const stress = Object.entries(perf.strategies).map(([k, s]) => '<tr><td>' + esc(k.replace(/_/g, ' ')) + '</td>' + (s.stress.length ? s.stress.map(r => '<td>' + (r.expectancy != null ? RR(r.expectancy) : 'n/a') + '</td>').join('') : '<td colspan="4">n/a</td>') + '</tr>').join('');
    const regime = Object.entries(perf.strategies).flatMap(([k, s]) => Object.entries(s.by_regime).map(([r, v]) => '<tr><td>' + esc(k.replace(/_/g, ' ')) + '</td><td>' + esc(r.replace(/_/g, ' ')) + '</td><td>' + v.n + '</td><td>' + (v.profit_factor ? N(v.profit_factor) : 'n/a') + '</td><td>' + RR(v.expectancy) + '</td></tr>')).join('');

    const cost = perf.costs, sp = g.spread_analysis;

    perfHtml = '<div class="in-sub">Research run ' + esc(perf.created.replace('T', ' ').slice(0, 16)) + ' UTC · ' + esc(perf.data.source) + ' data, ' + perf.data.rows + ' bars to ' + esc(when(perf.data.last)) + ' · quality ' + esc(perf.data.quality) +
      ' · code ' + esc(perf.code_version) + ' · out-of-sample = walk-forward test windows only; the last ' + Math.round(perf.walk_forward.holdout_frac * 100) + '% of bars is an untouched holdout.</div>' +
      '<table class="in-t"><tr><th>Strategy</th><th>OOS trades</th><th>Expectancy (net)</th><th>Profit factor</th><th>Max drawdown</th><th>Holdout</th><th>Walk-forward equity (R)</th></tr>' + rows + '</table>' +
      '<div class="in-sec" style="font-size:13px">Cost stress: net expectancy when spread and slippage are 0×, 1×, 2×, 3×</div><table class="in-t"><tr><th>Strategy</th><th>0×</th><th>1×</th><th>2×</th><th>3×</th></tr>' + stress + '</table>' +
      '<div class="in-sec" style="font-size:13px">Profit factor by market regime (out-of-sample trades)</div>' + (regime ? '<table class="in-t"><tr><th>Strategy</th><th>Regime</th><th>Trades</th><th>PF</th><th>Expectancy</th></tr>' + regime + '</table>' : '<div class="in-sub">No out-of-sample trades to split.</div>') +

  $('#result').innerHTML = banner +

  // ---------- interactive parts (all local, nothing reaches a broker)
  const post = async (url, body) => {
    const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'error');

      '<label>Max positions<input id="pf_mp" value="' + ps.limits.max_positions + '"></label><label>Max net units<input id="pf_mn" value="' + (ps.limits.max_net_units == null ? '' : ps.limits.max_net_units) + '"></label></div>' +
      '<table class="in-t"><tr><th>Open positions</th><th>Units</th><th>Entry</th><th>Stop</th><th>Target</th><th></th></tr>' + ps.positions.map((p, i) => row('positions', p, i)).join('') + '</table>' +
      '<div class="in-form"><label>Symbol<select id="np_sym"><option>GC=F</option><option>MGC=F</option><option>BTC-USD</option></select></label><label>Side<select id="np_side"><option>long</option><option>short</option></select></label>' +
      '<label>Units<input id="np_u"></label><label>Entry<input id="np_e"></label><label>Stop<input id="np_s"></label><label>Target<input id="np_t"></label><button type="button" class="chip" data-act="addpos">Add position</button></div>' +
      '<table class="in-t"><tr><th>Pending orders</th><th>Units</th><th>Price</th><th>Stop</th><th>Target</th><th></th></tr>' + ps.pending.map((p, i) => row('pending', p, i)).join('') + '</table>' +
      '<div class="in-form"><label>Symbol<select id="nd_sym"><option>GC=F</option><option>MGC=F</option><option>BTC-USD</option></select></label><label>Side<select id="nd_side"><option>long</option><option>short</option></select></label>' +
      '<label>Type<select id="nd_kind"><option>limit</option><option>stop</option><option>stop_limit</option></select></label><label>Units<input id="nd_u"></label><label>Price<input id="nd_p"></label><label>Stop<input id="nd_s"></label><button type="button" class="chip" data-act="addpend">Add pending order</button></div>' +
      '<div class="in-form"><button type="button" class="run" data-act="pfsave">Save</button> <span class="sub" id="pfmsg"></span></div>';
  };
  const readTop = () => {
    ps.equity = num('pf_eq'); ps.realised_today = num('pf_rt') || 0;
    ps.limits = {max_open_risk_pct: num('pf_mr'), daily_loss_limit_pct: num('pf_dl'), max_positions: num('pf_mp'), max_net_units: num('pf_mn')};
  };
  fetch('/api/portfolio').then(r => r.json()).then(s => { ps = s; drawPf(); }).catch(() => { $('#pfedit').textContent = 'Could not load the saved positions.'; });
  const drawJ = async () => {
    try {
      const j = await (await fetch('/api/journal')).json(), s = j.summary;
      const open = j.entries.filter(e => e.decision === 'TRADE' && !e.fill), live = j.entries.filter(e => e.fill && !e.close);
      $('#jrnl').innerHTML = '<div class="g-tiles">' + tile('Signals', s.signals, s.taken + ' taken · ' + s.refused + ' refused') + tile('Closed trades', s.closed, s.open + ' open') +
        tile('Mean slippage', s.mean_slippage_in_r == null ? 'n/a' : RR(s.mean_slippage_in_r), 'in units of planned risk') + tile('Planned vs realised risk', s.mean_risk_ratio == null ? 'n/a' : N(s.mean_risk_ratio, 2) + '×', 'realised ÷ planned') +
        tile('Mean result', s.mean_r == null ? 'n/a' : RR(s.mean_r), 'on realised risk') + '</div>' +
        (s.recurring.length ? '<div class="in-sub"><b>Recurring execution errors:</b> ' + esc(s.recurring.map(r => r.tag + ' ×' + r.count).join(', ')) + '</div>' : '<div class="in-sub">No recurring execution errors yet.</div>') +
        (j.entries.length ? '<table class="in-t"><tr><th>Signal ID</th><th>Decision</th><th>Strategy</th><th>Planned (entry / stop)</th><th>Versions</th><th>Status</th></tr>' + j.entries.slice(0, 12).map(e => '<tr><td style="word-break:break-all">' + esc(e.id) + '</td><td>' + pill(e.decision, e.decision === 'TRADE' ? 'good' : 'warn') + '</td><td>' + esc(e.strategy) + ' ' + esc(e.side) + '</td><td>' + N(e.planned.entry) + ' / ' + N(e.planned.stop) + '</td><td class="sub">code ' + esc(e.versions.code || '') + '<br>' + esc(e.versions.strategy_status || '') + (e.versions.model ? '<br>model ' + esc(e.versions.model) : '') + '</td><td>' + (e.close ? 'closed ' + RR(e.close.r_vs_realised_risk) + (e.tags.length ? ' · ' + esc(e.tags.join(', ')) : '') : e.fill ? 'open, filled at ' + N(e.fill.price) : e.decision === 'TRADE' ? 'waiting for fill' : 'refused: ' + esc((e.reasons[0] || '').slice(0, 70))) + '</td></tr>').join('') + '</table>' : '<div class="in-sub">The journal is empty. Use “Add to journal” on a plan above; refused plans are recorded too.</div>') +
        (open.length ? '<div class="in-form"><label>Record a fill<select id="jf_id">' + open.map(e => '<option value="' + esc(e.id) + '">' + esc(e.id.slice(0, 44)) + '</option>').join('') + '</select></label><label>Price<input id="jf_p"></label><label>Units<input id="jf_u"></label><button type="button" class="chip" data-act="jfill">Save fill</button></div>' : '') +
        (live.length ? '<div class="in-form"><label>Close a trade<select id="jc_id">' + live.map(e => '<option value="' + esc(e.id) + '">' + esc(e.id.slice(0, 44)) + '</option>').join('') + '</select></label><label>Exit price<input id="jc_p"></label><label>Tags<input id="jc_t" class="wide" placeholder="e.g. early exit, patient"></label><label>Notes<input id="jc_n" class="wide"></label><label>Stop moved?<select id="jc_m"><option value="">no</option><option value="1">yes</option></select></label><button type="button" class="chip" data-act="jclose">Close and analyse</button></div>' : '') +
        '<div class="in-sub" id="jmsg">Planned risk is what the plan said; realised risk is measured from the real fill to the planned stop. Entered by you; nothing is read from a broker.</div>';
    } catch (e) { $('#jrnl').textContent = 'Could not load the journal.'; }
  };
  drawJ();
  $('#result').onclick = async e => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const a = b.dataset.act, msg = t => { const m = $('#jmsg'); if (m) m.textContent = t; };
    try {
      if (a === 'journal') {
        const {a: as, c} = cands[+b.dataset.i], trade = as.decision !== 'NO TRADE';
        await post('/api/journal', {action: 'add_signal', symbol: g.symbol, interval: g.interval, decision: trade ? 'TRADE' : 'NO TRADE',
          reasons: trade ? ['all gates passed'] : as.blocking, signal: {id: c.id, strategy: as.strategy, side: c.side, decided_t: Math.round(Date.parse(o.last_closed_bar) / 1000), price: c.entry, stop: c.stop, targets: c.targets, note: c.note, invalidation: c.invalidation, regime: c.regime}});
        const m = $('#jmsg' + b.dataset.i); if (m) m.textContent = 'recorded'; drawJ();
      } else if (a === 'rm') { readTop(); ps[b.dataset.kind].splice(+b.dataset.i, 1); drawPf();
      } else if (a === 'addpos') {
        readTop(); ps.positions.push({id: 'p' + (ps.positions.length + 1), symbol: $('#np_sym').value, side: $('#np_side').value, units: num('np_u'), entry: num('np_e'), stop: num('np_s'), target: num('np_t')}); drawPf();
      } else if (a === 'addpend') {
        readTop(); ps.pending.push({id: 'o' + (ps.pending.length + 1), symbol: $('#nd_sym').value, side: $('#nd_side').value, kind: $('#nd_kind').value, units: num('nd_u'), price: num('nd_p'), stop: num('nd_s')}); drawPf();
      } else if (a === 'pfsave') {
        readTop(); ps = await post('/api/portfolio', {state: ps}); drawPf(); $('#pfmsg').textContent = 'saved. Run the page again to refresh the monitor.';
      } else if (a === 'jfill') {
        await post('/api/journal', {action: 'fill', id: $('#jf_id').value, price: num('jf_p'), units: num('jf_u')}); drawJ();
      } else if (a === 'jclose') {
        await post('/api/journal', {action: 'close', id: $('#jc_id').value, price: num('jc_p'), tags: $('#jc_t').value, notes: $('#jc_n').value, stop_moved: !!$('#jc_m').value}); drawJ();
      }
    } catch (err) {
      const t = a === 'pfsave' || a === 'rm' || a.startsWith('add') && a !== 'journal' ? $('#pfmsg') : null;
      if (t) t.textContent = err.message; else msg(err.message);
      if (a === 'journal') { const m = $('#jmsg' + b.dataset.i); if (m) m.textContent = err.message; }
    }
  };
}

function renderGoldNews(d){
  const g = JSON.parse(d.stdout), p = g.pressure, mk = g.market;
  const AS = g.asset || {name: 'Gold', short: 'gold', symbol: 'GC=F', cmd: 'gold'};
  const sg = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2);
  const cls = v => v > 0.05 ? 'gn-up' : v < -0.05 ? 'gn-dn' : 'gn-fl';
  const pcls = p.score >= 10 ? 'gn-up' : p.score <= -10 ? 'gn-dn' : 'gn-fl';
  const pos = Math.max(2, Math.min(98, 50 + p.score / 2));
  const tile = (k, v, s, c) => '<div class="gn-tile"><div class="k">' + esc(k) + '</div><div class="v ' + c + '">' + v + '</div><div class="s">' + s + '</div></div>';
  let tiles = '';
  if (mk) {
    tiles += tile(AS.name + ' (' + AS.symbol + ')', usd2(mk.base.last), '<span class="' + cls(mk.base.day) + '">' + sg(mk.base.day) + '% today</span> · ' + sg(mk.base.five) + '% 5d', '');
    mk.links.forEach(l => {
      const day = l.unit === '%' ? sg(l.day) + '%' : (l.day >= 0 ? '+' : '−') + Math.abs(l.day * 100).toFixed(0) + ' bp';
      const five = l.unit === '%' ? sg(l.five) + '%' : (l.five >= 0 ? '+' : '−') + Math.abs(l.five * 100).toFixed(0) + ' bp';
      const val = l.symbol === '^TNX' ? l.last.toFixed(2) + '%' : Math.round(l.last).toLocaleString('en-US');
      // colour by what the move usually means for this asset, not by up/down
      const good = l.corr60 == null ? 0 : (l.day * l.corr60);
      tiles += tile(l.name, val, '<span class="' + cls(good) + '">' + day + ' today</span> · ' + five + ' 5d', '');
    });
  }
  const gauge = '<div class="gn-gauge"><div class="k">News pressure on ' + esc(AS.short) + ' · last ' + g.hours + 'h</div>' +
    '<div class="big ' + pcls + '">' + (p.score >= 0 ? '+' : '−') + Math.abs(p.score).toFixed(0) + '</div><div class="lbl ' + pcls + '">' + esc(p.label) + '</div>' +
    '<div class="gn-bar"><i style="left:calc(' + pos.toFixed(1) + '% - 2px)"></i></div><div class="gn-scale"><span>bearish −100</span><span>0</span><span>+100 bullish</span></div>' +
    '<div class="sub" style="margin-top:8px">' + p.n + ' relevant of ' + g.scanned + ' headlines · <span class="gn-up">' + p.bull + ' bullish</span> · <span class="gn-dn">' + p.bear + ' bearish</span> · ' + p.neutral + ' neutral</div></div>';

  const confirm = g.confirm.length ? '<div class="g-h">Does the market agree with the news?</div><ul class="gn-confirm">' +
    g.confirm.map(c => '<li class="' + c[0] + '">' + (c[0] === 'good' ? '✓ ' : c[0] === 'warn' ? '⚠ ' : '· ') + esc(c[1]) + '</li>').join('') + '</ul>' : '';

  const drivers = '<div class="g-h">What is driving it · bars show headline counts: green pushes ' + esc(AS.short) + ' up, red pushes it down</div><div class="gn-drivers">' +
    g.drivers.map(x => {
      const t = x.bull + x.bear + x.mixed;
      const w = n => t ? (n / t * 100).toFixed(1) + '%' : '0';
      return '<div class="gn-drv' + (t ? '' : ' off') + '"><div class="nm"><span>' + esc(x.name) + '</span><span class="sub">' + (t ? x.bull + '▲ ' + x.bear + '▼' + (x.mixed ? ' ' + x.mixed + '◆' : '') : 'quiet') + '</span></div>' +
        '<div class="gn-split"><b class="u" style="width:' + w(x.bull) + '"></b><b class="m" style="width:' + w(x.mixed) + '"></b><b class="d" style="width:' + w(x.bear) + '"></b></div>' +
        '<div class="why">' + esc(x.why) + '</div></div>';
    }).join('') + '</div>';

  let links = '';
  if (mk && mk.links.length) {
    const cell = c => c.mean == null ? '<span class="sub">too few days</span>' : '<b class="' + cls(c.mean) + '">' + sg(c.mean) + '%</b> <span class="sub">(' + c.n + ' days)</span>';
    const meaning = l => {
      const c = l.corr60;
      if (c == null) return '';
      const s = Math.abs(c) < 0.2 ? 'Weak link lately' : (c < 0 ? 'Moves opposite ' + AS.short : 'Moves with ' + AS.short);
      return s + (Math.abs(c) >= 0.2 ? (Math.abs(c) >= 0.5 ? ' (strong)' : ' (moderate)') : '');
    };
    links = '<div class="g-h">How ' + esc(AS.short) + ' has reacted to other markets · measured on 2 years of daily moves</div><table class="gn-link"><thead><tr><th>Market</th><th>60-day link</th><th>' + esc(AS.name) + ' when it jumps</th><th>' + esc(AS.name) + ' when it drops</th><th>Read</th></tr></thead><tbody>' +
      mk.links.map(l => {
        const c = l.corr60 == null ? 0 : l.corr60, w = Math.abs(c) * 50;
        const bar = '<span class="gn-corr"><u></u><i style="' + (c >= 0 ? 'left:50%' : 'left:' + (50 - w) + '%') + ';width:' + w + '%;background:' + (c >= 0 ? '#0b6b4f' : '#b42318') + '"></i></span> <span class="sub">' + (l.corr60 == null ? 'n/a' : (c >= 0 ? '+' : '−') + Math.abs(c).toFixed(2)) + '</span>';
        return '<tr><td><b>' + esc(l.name) + '</b></td><td>' + bar + '</td><td>' + cell(l.up) + '</td><td>' + cell(l.down) + '</td><td class="sub">' + meaning(l) + '</td></tr>';
      }).join('') + '</tbody></table><div class="note">"Jumps" and "drops" mean a daily move of more than half its usual size. Correlation runs from −1 (opposite) to +1 (together); it changes over time.</div>';
  }

  const lean = p.score >= 10 ? 1 : p.score <= -10 ? -1 : 0;
  const use = '<div class="gn-use"><b>How to use this with your trade plans.</b> ' +
    (lean > 0 ? 'News leans bullish: it adds weight to BUY plans graded A or B on the ' + esc(AS.name) + ' assessment and argues against fading rallies. ' :
     lean < 0 ? 'News leans bearish: it adds weight to SELL plans graded A or B and argues for caution on BUY dips. ' :
     'News is balanced: let the price levels and trade grades lead, and do not size up on news alone. ') +
    'News never moves your stop. Headlines that hit price already show up in the move, so avoid chasing a spike; wait for the plan\'s entry. <a href="#' + AS.cmd + '">Open ' + esc(AS.name) + ' assessment</a></div>';

  const mc = g.macro;
  const evli = L => L.length ? L.map(e => '<li>' + esc(new Date(e.ts * 1000).toISOString().replace('T', ' ').slice(0, 16) + ' UTC · ' + e.name + ' · ' + e.source + ' [' + e.reliability + ']') + '</li>').join('') : '<li>none</li>';
  const macroBlock = mc && mc.have_events
    ? '<div class="g-h">Scheduled releases · from your stored calendar</div><div class="gn-top" style="grid-template-columns:1fr 1fr"><div><b>Upcoming high-impact (72 h)</b><ul class="in-list">' + evli(mc.upcoming) + '</ul></div><div><b>Recent (24 h)</b><ul class="in-list">' + evli(mc.recent) + '</ul></div></div><div class="note">' + esc(mc.note) + ' Sources: ' + esc(mc.sources.join(', ')) + '.</div>'
    : '<div class="note">No scheduled releases are stored. Run <b>Update economic events</b> (official FOMC dates plus derived NFP dates) to see them here.</div>';
  const heads = g.headlines;
  const state = {f: 'all'};
  const draw = () => {
    const rows = heads.filter(h => state.f === 'all' || (state.f === 'high' ? h.impact === 'high' : h.direction === state.f));
    $('#gnl').innerHTML = rows.length ? rows.map(h => {
      const url = safeUrl(h.link);
      return '<li class="' + h.direction + '"><div class="meta"><span class="gn-dir ' + h.direction + '">' + h.direction.toUpperCase() + ' ' + (h.score >= 0 ? '+' : '−') + Math.abs(h.score).toFixed(1) + '</span>' +
        '<span class="chip tk">' + h.impact + ' impact</span>' +
        h.drivers.map(x => '<span class="chip">' + esc(x.name) + (x.dir === 'mixed' ? ' ◆' : x.dir === 'bull' ? ' ▲' : ' ▼') + '</span>').join('') +
        '<span>' + esc(h.source || '') + ' · ' + esc(timeAgo(h.time)) + '</span></div>' +
        (url ? '<a class="t" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(h.title) + '</a>' : '<span class="t">' + esc(h.title) + '</span>') + '</li>';
    }).join('') : '<li class="note">Nothing matches.</li>';
  };
  $('#result').innerHTML =
    '<div class="sub">checked ' + esc(new Date(g.checked * 1000).toLocaleString()) + ' · delayed prices · headlines from Yahoo Finance and Google News</div>' +
    '<div class="gn-top">' + gauge + '<div class="gn-tiles">' + tiles + '</div></div>' + confirm + use + macroBlock + drivers + links +
    '<div class="g-h">Headlines ranked by likely impact on ' + esc(AS.short) + '</div><div class="bar">' +
    [['all', 'All'], ['high', 'High impact'], ['bullish', 'Bullish'], ['bearish', 'Bearish'], ['neutral', 'Neutral']].map(f => '<button type="button" class="chip' + (f[0] === 'all' ? ' on' : '') + '" data-gf="' + f[0] + '">' + f[1] + '</button>').join('') +
    '</div><ul class="gn-hl" id="gnl"></ul>' +
    g.errors.map(e => '<div class="note">' + esc(e) + '</div>').join('') +
    '<div class="note">Scores come from keyword rules that read wording, not meaning (they can miss sarcasm, negation and context). Headlines are leads, not facts. Correlations describe the past. Not financial advice.</div>';
  $('#result').onclick = e => {                       // onclick, so a re-run replaces the old handler
    const b = e.target.closest('button[data-gf]'); if (!b) return;
    state.f = b.dataset.gf;
    document.querySelectorAll('button[data-gf]').forEach(x => x.classList.toggle('on', x === b)); draw();
  };
  draw();
}

async function watchApi(action, extra, asset){
  const r = await fetch('/api/' + (asset || 'gold') + '/watch', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(Object.assign({action}, extra || {}))});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'error');
  return d;
}
function beep(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  } catch (e) { /* sound is optional */ }
}
function timeAgo(sec){
  const m = Math.round((Date.now() / 1000 - sec) / 60);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago';
}

function showAlerts(asset){
  asset = asset || 'gold';
  const AN = asset === 'btc' ? {name: 'Bitcoin', lc: 'bitcoin', opts: ['BTC-USD']} : {name: 'Gold', lc: 'gold', opts: ['GC=F', 'MGC=F']};
  $('#main').innerHTML =
    '<div class="card"><h3>' + AN.name + ' alerts</h3>' +
    '<p>Watches delayed ' + AN.lc + ' prices and notifies you when price comes near a key level or a setup trigger on the 15-minute, 1-hour and 4-hour charts. It never places orders.' +
    (asset === 'btc' ? ' Bitcoin trades around the clock, so this keeps watching nights and weekends too.' : '') + '</p>' +
    '<div class="al-stat" id="alstat"></div>' +
    '<div class="fields">' +
      '<label>Contract<select id="al_symbol">' + AN.opts.map(o => '<option>' + o + '</option>').join('') + '</select></label>' +
      '<label class="check"><input type="checkbox" id="al_15m" checked> 15m</label>' +
      '<label class="check"><input type="checkbox" id="al_1h" checked> 1h</label>' +
      '<label class="check"><input type="checkbox" id="al_4h" checked> 4h</label>' +
      '<label>Notify when within (ATR)<input type="number" id="al_near" step="0.1" min="0.1" max="3" value="0.5"></label>' +
      '<label>Check every<select id="al_poll"><option value="2">2 min</option><option value="5" selected>5 min</option><option value="10">10 min</option><option value="15">15 min</option></select></label>' +
      '<label class="check"><input type="checkbox" id="al_toast" checked> Windows notification</label>' +
      '<label class="check" title="Confirmed validated setups, invalidations, regime changes, high-impact events, stale data, exposure, loss limit, unprotected positions, conflicting orders"><input type="checkbox" id="al_intel" checked> Intelligence alerts</label>' +
      '<label class="check" title="Validated pending-order setups, price near a trigger, invalidations, paper-order state changes, news, spread and risk limits. Paper orders only; nothing reaches a broker."><input type="checkbox" id="al_pending" checked> Pending order alerts</label>' +
      '<label>Warn before events (min)<input type="number" id="al_lead" step="5" min="5" max="240" value="30"></label>' +
      '<label>Max extra alerts / hour<input type="number" id="al_cap" step="1" min="1" max="60" value="12"></label>' +
      '<label>Repeat after (min)<input type="number" id="al_cool" step="10" min="10" max="720" value="60"></label>' +
    '</div>' +
    '<div class="bar"><button class="run" type="button" id="al_start">Start watching</button>' +
      '<button class="chip" type="button" id="al_stop">Stop</button>' +
      '<button class="chip" type="button" id="al_check">Check now</button>' +
      '<button class="chip" type="button" id="al_test">Send test alert</button>' +
      '<button class="chip" type="button" id="al_perm">Allow browser notifications</button>' +
      '<button class="chip" type="button" id="al_clear">Clear feed</button></div>' +
    '<div class="g-h">Right now · nearest key level above and below, in each chart\'s own ATR (highlighted = inside your alert distance)</div><div id="alsnap" class="note">Press Check now or Start watching.</div>' +
    '<div class="g-h">Alerts</div><div class="feed" id="alfeed"></div>' +
    '<div class="note">Rules: on each ticked timeframe an alert fires when price is within your ATR distance of (1) a key level, meaning a price area where two or more timeframes line up or three-plus levels stack on a 1h+ chart, or (2) a setup\'s entry zone or breakout trigger. Each rule fires once, then re-arms after price moves away, and waits at least 30 min (15m), 90 min (1h) or 4 h (4h) between repeats. A breakout alert means the trigger is near or touched; the setup still needs the candle close. Quotes are delayed, so alerts are leads, not signals. Not financial advice.</div>' +
    '</div>';
  let formLoaded = false;
  const readForm = () => ({
    symbol: $('#al_symbol').value,
    tfs: ['15m', '1h', '4h'].filter(t => $('#al_' + t).checked),
    near_atr: parseFloat($('#al_near').value),
    poll_min: parseInt($('#al_poll').value, 10),
    toast: $('#al_toast').checked,
    intel: $('#al_intel').checked,
    pending: $('#al_pending').checked,
    event_lead_min: parseInt($('#al_lead').value, 10),
    max_alerts_per_hour: parseInt($('#al_cap').value, 10),
    extras_cooldown_min: parseInt($('#al_cool').value, 10)
  });
  const fillForm = s => {
    $('#al_symbol').value = s.symbol; ['15m', '1h', '4h'].forEach(t => $('#al_' + t).checked = s.tfs.includes(t));
    $('#al_near').value = s.near_atr; $('#al_poll').value = String(s.poll_min); $('#al_toast').checked = s.toast;
    $('#al_intel').checked = !!s.intel; $('#al_pending').checked = !!s.pending; if (asset !== 'gold') $('#al_pending').closest('label').style.display = 'none'; $('#al_lead').value = s.event_lead_min; $('#al_cap').value = s.max_alerts_per_hour; $('#al_cool').value = s.extras_cooldown_min;
  };
  const render = st => {
    if (!formLoaded) { fillForm(st.settings); formLoaded = true; }
    $('#alstat').innerHTML = '<span class="pill ' + (st.running ? 'on' : '') + '">' + (st.running ? 'Watching' : 'Stopped') + '</span>' +
      (st.snapshot ? '<span><b>' + usd2(st.snapshot.price) + '</b> <span class="sub">last 15m close, delayed</span></span>' : '') +
      (st.last_check ? '<span class="sub">checked ' + timeAgo(st.last_check) + '</span>' : '') +
      (st.running && st.next_check ? '<span class="sub">next in ' + Math.max(0, Math.round((st.next_check - st.now) / 60)) + ' min</span>' : '') +
      (st.live_setups ? '<span class="sub">' + st.live_setups + ' confirmed setup(s) being tracked</span>' : '') +
      (st.suppressed ? '<span class="sub">' + st.suppressed + ' alert(s) held back by your hourly cap</span>' : '') +
      (st.error ? '<span class="g-down">Last error: ' + esc(st.error) + '</span>' : '');
    const near = st.settings.near_atr;
    const cell = (l) => {
      if (!l) return '<td>none within 5%</td>';
      const hot = l.dist_atr <= near;
      return '<td class="' + (hot ? 'hot' : '') + '">' + (l.hi - l.lo >= 1 ? usd(l.lo) + '–' + usd(l.hi) : usd(l.mid)) +
        '<div class="sub">' + esc(l.tfs.join('+')) + ' · ' + (l.dist === 0 ? 'inside' : l.dist_atr.toFixed(1) + ' ATR') + '</div></td>';
    };
    $('#alsnap').innerHTML = st.snapshot
      ? '<table class="snap"><tr><th>Chart</th><th>Bias</th><th>1 ATR</th><th>Key level above</th><th>Key level below</th></tr>' +
        st.snapshot.rows.map(r => '<tr><td><b>' + r.tf + '</b></td><td class="' + (r.bias === 'bearish' ? 'g-down' : r.bias === 'bullish' ? 'g-up' : 'g-flat') + '">' + r.bias + '</td><td>' + usd2(r.atr) + '</td>' + cell(r.above) + cell(r.below) + '</tr>').join('') + '</table>'
      : 'Press Check now or Start watching.';
    $('#alfeed').innerHTML = st.alerts.length ? st.alerts.map(a =>
      '<div class="al ' + esc(a.kind || '') + '"><div class="m"><span class="chip tk">' + esc(a.tf) + '</span> ' + esc(new Date(a.ts).toLocaleString()) + (a.price ? ' · ' + usd2(a.price) : '') + '</div>' +
      '<div class="t">' + esc(a.title) + '</div><div class="b">' + esc(a.body) + '</div></div>').join('')
      : '<div class="note">No alerts yet.</div>';
    // new alerts since the last look: desktop notification + sound (only after the first load)
    const maxId = st.alerts.length ? Math.max(...st.alerts.map(a => a.id || 0)) : 0;
    if (lastAlertId !== null && maxId > lastAlertId) {
      const fresh = st.alerts.filter(a => (a.id || 0) > lastAlertId).slice(0, 3);
      beep();
      if ('Notification' in window && Notification.permission === 'granted')
        fresh.forEach(a => { try { new Notification(a.title, {body: a.body}); } catch (e) { /* ignore */ } });
    }
    lastAlertId = maxId;
  };
  const refresh = async () => { try { render(await (await fetch('/api/' + asset + '/watch')).json()); } catch (e) { /* server busy */ } };
  const act = async (action, extra, label) => {
    const btn = label && $('#' + label); if (btn) btn.disabled = true;
    try { render(await watchApi(action, extra, asset)); } catch (e) { $('#alstat').insertAdjacentHTML('beforeend', '<span class="g-down">' + esc(e.message) + '</span>'); }
    if (btn) btn.disabled = false;
  };
  $('#al_start').onclick = () => { beep(); act('start', {settings: readForm()}, 'al_start'); };
  $('#al_stop').onclick = () => act('stop');
  $('#al_check').onclick = () => act('check', {}, 'al_check');
  $('#al_test').onclick = () => { beep(); act('test'); };
  $('#al_clear').onclick = () => act('clear');
  $('#al_perm').onclick = async () => {
    if (!('Notification' in window)) { alert('This browser has no notification support.'); return; }
    const p = await Notification.requestPermission();
    $('#al_perm').textContent = p === 'granted' ? 'Browser notifications on' : 'Notifications ' + p;
  };
  ['al_symbol', 'al_15m', 'al_1h', 'al_4h', 'al_near', 'al_poll', 'al_toast', 'al_intel', 'al_pending', 'al_lead', 'al_cap', 'al_cool'].forEach(id =>
    $('#' + id).addEventListener('change', () => act('settings', {settings: readForm()})));
  if ('Notification' in window && Notification.permission === 'granted') $('#al_perm').textContent = 'Browser notifications on';
  lastAlertId = null;
  refresh();
  alertTimer = setInterval(refresh, 15000);
}

async function showFiles(){
  const d = await (await fetch('/api/files')).json();
  $('#main').innerHTML = '<div class="card"><h3>trader/ files</h3><p>What the skills have written so far (read only).</p>' +
    (d.files.length ? '<div class="files">' + d.files.map(f => '<button data-f="' + esc(f) + '">' + esc(f) + '</button>').join('') + '</div>'
      : '<div class="note">Nothing yet. Run “Build targets” or “Budget sizing” with writing switched on.</div>') +
    '<div id="result"></div></div>';
  $('.files') && $('.files').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    const r = await fetch('/api/file?name=' + encodeURIComponent(b.dataset.f)); const j = await r.json();
    $('#result').innerHTML = '<div class="cmd">trader/' + esc(b.dataset.f) + '</div><pre>' + esc(j.text || j.error) + '</pre>';
  });
}
window.addEventListener('hashchange', () => { if (commands.length) show(location.hash.slice(1) || commands[0].id); });
init();
