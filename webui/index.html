<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader Console</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16191d;--mute:#667085;--line:#e3e6ea;--accent:#0b6b4f;--accent-ink:#fff;--out:#0f1418;--out-ink:#d7e0e6;--err:#ff9a8a;--ok:#0b6b4f;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0e1114;--panel:#161a1f;--ink:#e8ecef;--mute:#8b96a1;--line:#262c33;--accent:#2fb585;--accent-ink:#06130d;--out:#0a0d10;--out-ink:#cfd8de;--ok:#2fb585;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:16px;margin:0}
.sub{color:var(--mute);font-size:12px}
.ua{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.ua input{width:260px}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
nav{border-right:1px solid var(--line);padding:10px;background:var(--panel);overflow:auto}
nav h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 6px 4px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:6px;cursor:pointer;font:inherit}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent);color:var(--accent-ink)}
main{padding:16px;max-width:980px;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 2px;font-size:15px}
.card p{margin:0 0 10px;color:var(--mute)}
.fields{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
label.check{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
input[type=text],input[type=number],select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;min-width:140px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.run{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:8px 18px;font:inherit;font-weight:600;cursor:pointer}
.run:disabled{opacity:.6;cursor:wait}
.cmd{font:12px ui-monospace,Consolas,monospace;color:var(--mute);margin:10px 0 6px;word-break:break-all}
pre{margin:0;background:var(--out);color:var(--out-ink);border-radius:8px;padding:12px;overflow:auto;max-height:60vh;font:12.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre}
pre.err{color:var(--err);margin-top:8px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.badge.ok{color:var(--ok)}.badge.bad{color:var(--bad)}.badge.warn{color:var(--mute)}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 8px}
.bar input[type=text]{min-width:200px;flex:1}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.tk{color:var(--accent);border-color:var(--accent);cursor:default;background:none}
.chip.tag-earnings{color:#b54708;border-color:#b54708}.chip.tag-deal{color:#175cd3;border-color:#175cd3}.chip.tag-people{color:#6941c6;border-color:#6941c6}
@media (prefers-color-scheme:dark){.chip.tag-earnings{color:#fdb022;border-color:#fdb022}.chip.tag-deal{color:#84caff;border-color:#84caff}.chip.tag-people{color:#b692f6;border-color:#b692f6}}
.news{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.item.is-new{border-left-color:var(--accent)}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:4px}
.item a.t{color:var(--ink);font-weight:600;font-size:14.5px;text-decoration:none}
.item a.t:hover{text-decoration:underline;color:var(--accent)}
.item .sum{margin:5px 0 0;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .sum.open{-webkit-line-clamp:unset}
.item .more{background:none;border:0;color:var(--accent);padding:0;margin-top:3px;cursor:pointer;font:inherit;font-size:12px}
details.raw{margin-top:10px}details.raw summary{cursor:pointer;color:var(--mute);font-size:12px}
.g-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.g-tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.g-tile .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.g-tile .v{font-size:20px;font-weight:700;margin-top:2px}
.g-tile .s{font-size:12px;color:var(--mute)}
.g-up{color:var(--ok)}.g-down{color:var(--bad)}.g-flat{color:var(--mute)}
.g-range{position:relative;height:8px;border-radius:4px;background:var(--line);margin:10px 2px 4px}
.g-range i{position:absolute;top:-3px;width:4px;height:14px;border-radius:2px;background:var(--ink)}
.g-bottom{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin:10px 0 14px;background:var(--bg)}
.g-bottom h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.g-bottom ul{margin:0;padding-left:18px}.g-bottom li{margin:4px 0}
.g-tabs{display:flex;gap:6px;margin:6px 0 10px}
.g-tabs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}
.g-tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.g-h{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 0 6px}
.ladder{display:grid;gap:4px}
.lad{display:grid;grid-template-columns:150px 70px 70px 1fr;gap:8px;align-items:center;padding:6px 10px;border-radius:6px;border-left:4px solid var(--line);background:var(--bg);font-size:13px}
.lad.res{border-left-color:var(--bad)}.lad.sup{border-left-color:var(--ok)}
.lad.now{border-left-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:700}
.lad .dots{letter-spacing:2px;color:var(--accent)}.lad.now .dots{color:inherit}
.lad .sig{color:var(--mute);font-size:11.5px}.lad.now .sig{color:inherit}
.sc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.sc .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.sc .name{font-weight:700}
.badge2{font-size:11px;font-weight:700;padding:2px 9px;border-radius:5px;color:#fff}
.badge2.buy{background:#0b6b4f}.badge2.sell{background:#b42318}
.sc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px}
.sc .grid .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.sc .grid .v{font-size:13.5px}
.r-good{color:var(--ok);font-weight:700}.r-ok{font-weight:600}.r-thin{color:var(--mute)}
.sc.dim{opacity:.6}
.sc.plan{padding:12px 14px}
.sc .rk{font-weight:800;color:var(--mute)}
.grade{font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;border:1px solid var(--line)}
.grade.A{background:var(--ok);color:#fff;border-color:var(--ok)}.grade.B{border-color:var(--accent);color:var(--accent)}.grade.C{color:var(--mute)}
.stt{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.stt.hot{background:#b54708;border-color:#b54708;color:#fff}.stt.near{border-color:#b54708;color:#b54708}
.ptrack{position:relative;height:34px;margin:8px 0 6px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.ptrack i{position:absolute;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--mute)}
.ptrack i.e{background:var(--accent);width:4px}.ptrack i.s{background:#b42318}.ptrack i.t{background:#0b6b4f}.ptrack i.n{background:var(--ink);width:2px;top:0;bottom:0}
.ptrack{margin-top:22px!important;margin-bottom:20px!important}.ptrack b.n{top:auto;bottom:-16px;color:var(--ink)}
.ptrack b{position:absolute;top:-15px;font-size:9.5px;font-weight:700;transform:translateX(-50%);color:var(--mute);white-space:nowrap}
.pnote{font-size:12.5px;margin-top:6px;color:var(--ink)}.pnote.sub{color:var(--mute)}
.gn-top{display:grid;grid-template-columns:minmax(260px,1.2fr) 2fr;gap:12px;margin-bottom:12px}
@media (max-width:760px){.gn-top{grid-template-columns:1fr}}
.gn-gauge{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.gn-gauge .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.gn-gauge .big{font-size:34px;font-weight:800;line-height:1.1}.gn-gauge .lbl{font-weight:700;margin-bottom:8px}
.gn-bar{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,#b42318,#d0d5dd 50%,#0b6b4f);margin:10px 0 4px}
.gn-bar i{position:absolute;top:-4px;width:4px;height:20px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.gn-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute)}
.gn-up{color:#0b6b4f}.gn-dn{color:#b42318}.gn-fl{color:var(--mute)}
@media (prefers-color-scheme:dark){.gn-up{color:#32d583}.gn-dn{color:#f97066}}
.gn-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.gn-tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.gn-tile .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}.gn-tile .v{font-size:20px;font-weight:700}.gn-tile .s{font-size:12px;color:var(--mute)}
.gn-confirm{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.gn-confirm li{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 12px;background:var(--bg);font-size:13.5px}
.gn-confirm li.good{border-left-color:#0b6b4f}.gn-confirm li.warn{border-left-color:#b54708}.gn-confirm li.flat{border-left-color:var(--line)}
.gn-drivers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:12px}
.gn-drv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.gn-drv.off{opacity:.5}.gn-drv .nm{font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.gn-split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin-bottom:6px}
.gn-split b{display:block;height:100%}.gn-split .u{background:#0b6b4f}.gn-split .d{background:#b42318}.gn-split .m{background:#98a2b3}
.gn-drv .why{font-size:12px;color:var(--mute)}
.gn-link{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
.gn-link th{font-size:11px;color:var(--mute);text-transform:uppercase;text-align:left;padding:4px 8px;letter-spacing:.04em}
.gn-link td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}
.gn-corr{position:relative;width:120px;height:10px;border-radius:99px;background:var(--line);display:inline-block;vertical-align:middle}
.gn-corr i{position:absolute;top:0;height:10px;border-radius:99px}.gn-corr u{position:absolute;left:50%;top:-2px;width:1px;height:14px;background:var(--mute)}
.gn-hl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.gn-hl li{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:9px 12px;background:var(--bg)}
.gn-hl li.bullish{border-left-color:#0b6b4f}.gn-hl li.bearish{border-left-color:#b42318}.gn-hl li.neutral{border-left-color:var(--line)}
.gn-hl .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:4px}
.gn-hl a.t,.gn-hl .t{color:var(--ink);font-weight:600;text-decoration:none}.gn-hl a.t:hover{text-decoration:underline}
.gn-dir{font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;color:#fff}.gn-dir.bullish{background:#0b6b4f}.gn-dir.bearish{background:#b42318}.gn-dir.neutral{background:#667085}
.gn-use{border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin:12px 0;background:var(--bg)}
details.more{margin:6px 0}details.more summary{cursor:pointer;color:var(--mute);font-size:13px;padding:4px 0}
.tfs{display:flex;gap:3px;flex-wrap:wrap}
.tfc{font-size:10.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.tfc.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.lad.now .tfs{display:none}
.lad.conf{grid-template-columns:150px 190px 70px 1fr}
@media (max-width:760px){.lad.conf{grid-template-columns:1fr 60px}.lad.conf .tfs{grid-column:1/-1}}
.al-stat{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0}
.pill{font-weight:700;padding:3px 12px;border-radius:99px;border:1px solid var(--line)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.feed{display:grid;gap:6px}
.al{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;background:var(--bg)}
.al.setup{border-left-color:#175cd3}.al.test{border-left-color:var(--mute)}
.al .t{font-weight:700}.al .m{font-size:12px;color:var(--mute);margin-bottom:2px}
.al .b{font-size:13px}
table.snap{border-collapse:collapse;width:100%;font-size:13px}
table.snap th,table.snap td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.snap th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
td.hot{background:rgba(11,107,79,.14);font-weight:600}
.bar .chip{font-size:12px;padding:5px 12px}
.bt-verdict{border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--bg)}
.bt-verdict.neutral{border-color:var(--mute)}.bt-verdict.good{border-color:var(--ok)}.bt-verdict.bad{border-color:var(--bad)}
.bt-verdict .big{font-size:22px;font-weight:800;margin-bottom:4px}
.bt-verdict.good .big{color:var(--ok)}.bt-verdict.bad .big{color:var(--bad)}
.bt-verdict ul{margin:6px 0 0;padding-left:18px}.bt-verdict li{margin:3px 0}
.bt-h{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:20px 0 4px}
.bt-sub{font-size:12.5px;color:var(--mute);margin:0 0 8px}
.bt-chart{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.bt-chart text{fill:var(--mute);font-size:11px;font-family:inherit}
.bt-chart .grid{stroke:var(--line);stroke-width:1}
.bt-chart .zero{stroke:var(--mute);stroke-width:1.2;stroke-dasharray:4 3}
.bt-chart .l-all{stroke:var(--ink);fill:none;stroke-width:2}
.bt-chart .l-with{stroke:var(--accent);fill:none;stroke-width:2}
.bt-chart .tx-all{fill:var(--ink);font-weight:700}.bt-chart .tx-with{fill:var(--accent);font-weight:700}
.rb{display:grid;grid-template-columns:200px 1fr 190px;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.rb .rl{font-size:13px}.rb .rv{font-size:13px;font-weight:700}
.rb svg{width:100%;height:22px}
.rb .zline{stroke:var(--mute);stroke-width:1}
.rb .pos .bar2{fill:var(--ok)}.rb .neg .bar2{fill:var(--bad)}.rb .unk .bar2{fill:var(--mute);opacity:.55}
.rb .wk{stroke:var(--ink);stroke-width:1.6}
.rb .empty{font-size:12px;color:var(--mute)}
.bt-legend{font-size:12px;color:var(--mute);margin-top:6px}
.bt-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:90px repeat(3,1fr);gap:6px;align-items:stretch}
.heat .hh{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;align-self:end}
.heat .hr{font-weight:700;align-self:center}
.tile2{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;min-height:68px}
.tile2 .a{font-size:20px;font-weight:800}.tile2 .n{font-size:11.5px;color:var(--mute)}
.hist{display:flex;gap:8px;align-items:flex-end;height:150px;border-bottom:1px solid var(--mute);padding:0 4px}
.hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mute)}
.hist .col b{display:block;width:100%;border-radius:4px 4px 0 0}
.hist-l{display:flex;gap:8px;padding:4px 4px 0}.hist-l span{flex:1;text-align:center;font-size:11px;color:var(--mute)}
@media (max-width:760px){.rb{grid-template-columns:1fr}.heat{grid-template-columns:70px repeat(3,1fr)}}
@media (max-width:760px){.lad{grid-template-columns:1fr 60px 60px}.lad .sig{grid-column:1/-1}}
.files button{margin:0 6px 6px 0;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}nav h2{width:100%;margin:6px 4px 0}nav button{width:auto}.ua input{width:100%}}
</style>
</head>
<body>
<header>
  <div><h1>Trader Console</h1><div class="sub" id="meta">loading…</div></div>
  <div class="ua"><label style="flex-direction:row;align-items:center;gap:6px">SEC identity
    <input type="text" id="ua" placeholder="Your Name you@example.com" autocomplete="off"></label></div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let commands = [], current = null, alertTimer = null, lastAlertId = null, audioCtx = null;

try { $('#ua').value = localStorage.getItem('sec_ua') || ''; } catch(e){}
$('#ua').addEventListener('input', e => { try { localStorage.setItem('sec_ua', e.target.value); } catch(_){} });

async function init(){
  const r = await fetch('/api/commands'); const d = await r.json();
  commands = d.commands;
  $('#meta').textContent = 'Python ' + d.python + ' · running from ' + d.root + ' · no order is ever placed from here';
  const groups = {};
  commands.forEach(c => (groups[c.group] = groups[c.group] || []).push(c));
  $('#nav').innerHTML = Object.entries(groups).map(([g, cs]) =>
    '<h2>' + esc(g) + '</h2>' + cs.map(c => '<button data-id="' + c.id + '">' + esc(c.title) + '</button>').join('') +
    (g === 'Gold' ? '<button data-id="_alerts">Gold alerts</button>' : '')).join('')
    + '<h2>Data</h2><button data-id="_files">trader/ files</button>';
  $('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.id); });
  show(location.hash.slice(1) || commands[0].id);
}

function field(p){
  const id = 'f_' + p.name;
  if (p.kind === 'check')
    return '<label class="check"><input type="checkbox" id="' + id + '"' + (p.default ? ' checked' : '') + '> ' + esc(p.label) + '</label>';
  if (p.kind === 'select')
    return '<label>' + esc(p.label) + '<select id="' + id + '">' +
      p.choices.map(c => '<option' + (c === p.default ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></label>';
  return '<label>' + esc(p.label) + '<input id="' + id + '" type="' + (p.kind === 'number' ? 'number' : 'text') +
    '" step="any" value="' + esc(p.default) + '" autocomplete="off"></label>';
}

function show(id){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  history.replaceState(null, '', '#' + id);
  if (alertTimer) { clearInterval(alertTimer); alertTimer = null; }
  if (id === '_alerts') return showAlerts();
  if (id === '_files') return showFiles();
  current = commands.find(c => c.id === id) || commands[0];
  const c = current;
  $('#main').innerHTML =
    '<div class="card"><h3>' + esc(c.title) + '</h3><p>' + esc(c.help) + '</p>' +
    '<form id="form"><div class="fields">' + c.params.map(field).join('') + '</div>' +
    '<button class="run" type="submit">Run</button></form>' +
    '<div class="cmd" id="cmdline"></div><div id="result"></div></div>';
  $('#form').addEventListener('submit', e => { e.preventDefault(); run(c); });
}

async function run(c){
  const values = {_sec_user_agent: $('#ua').value};
  c.params.forEach(p => { const el = $('#f_' + p.name); values[p.name] = p.kind === 'check' ? el.checked : el.value; });
  const btn = $('.run'); btn.disabled = true; btn.textContent = 'Running…';
  $('#result').innerHTML = ''; $('#cmdline').textContent = '';
  try {
    const r = await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:c.id, values})});
    const d = await r.json();
    if (!r.ok) { $('#result').innerHTML = '<pre class="err">' + esc(d.error || 'error') + '</pre>'; return; }
    $('#cmdline').textContent = '$ ' + d.command;
    if (d.view === 'news' && d.code === 0) { try { return renderNews(d); } catch (e) { /* fall back to raw text */ } }
    if (d.view === 'gold' && d.code === 0) { try { return renderGold(d); } catch (e) { console.error(e); } }
    if (d.view === 'goldnews' && d.code === 0) { try { return renderGoldNews(d); } catch (e) { console.error(e); } }
    if (d.view === 'backtest' && d.code === 0) { try { return renderBacktest(d); } catch (e) { console.error(e); } }
    $('#result').innerHTML =
      '<span class="badge ' + (d.code === 0 ? 'ok' : d.code === 1 ? 'warn' : 'bad') + '">exit ' + d.code + '</span> ' +
      '<span class="sub">' + d.seconds + 's' + (d.code === 1 ? ' · exit 1 is a result for several tools (market closed, order blocked, nothing to do): read the output' : '') + '</span>' +
      (d.stdout ? '<pre>' + esc(d.stdout) + '</pre>' : '') +
      (d.stderr ? '<pre class="err">' + esc(d.stderr) + '</pre>' : '') +
      (!d.stdout && !d.stderr ? '<div class="note">No output.</div>' : '');
  } catch (e) {
    $('#result').innerHTML = '<pre class="err">' + esc(e) + '</pre>';
  } finally { btn.disabled = false; btn.textContent = 'Run'; }
}

function ago(iso){
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (isNaN(m)) return '';
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  return Math.round(h / 24) + ' d ago';
}
function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : ''; }

const usd = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const usd2 = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pctf = (n, d = 1) => (n >= 0 ? '+' : '') + n.toFixed(d) + '%';
const FRIENDLY = {
  'LONG on a pullback': 'Buy a dip into support',
  'LONG on a breakout': 'Buy a break above resistance',
  'SHORT on a rally into resistance': 'Sell a rally into resistance',
  'SHORT on a breakdown': 'Sell a break below support'
};
const TREND_LABEL = {with: 'with the trend', counter: 'against the trend', range: 'no clear trend'};

function renderGold(d){
  const g = JSON.parse(d.stdout), a = g.analysis;
  const intra = g.intraday || {};
  const secs = {'15m': intra['15m'], '1h': intra['1h'], '4h': intra['4h'], short: g.short, long: g.long};
  const TABS = [['15m', '15-minute'], ['1h', '1-hour'], ['4h', '4-hour'], ['short', 'Daily'], ['long', 'Weekly']].filter(t => secs[t[0]]);
  const TFNAME = {'15m': '15m', '1h': '1h', '4h': '4h', short: 'daily', long: 'weekly'};
  const sec0 = g.short || g.long || intra['4h'];
  const biasCls = b => b === 'bullish' ? 'g-up' : b === 'bearish' ? 'g-down' : 'g-flat';
  const rangePos = a.hi52 > a.lo52 ? Math.min(100, Math.max(0, (a.last - a.lo52) / (a.hi52 - a.lo52) * 100)) : 50;
  const checks = (g.trend_read.match(/\((\d) of 4/) || [])[1];
  const trendWord = g.trend_read.split(' (')[0];

  // ---- bottom line
  const bl = [];
  const biasText = TABS.map(t => t[1] + ': ' + secs[t[0]].bias).join(' · ');
  bl.push('<b>Trend:</b> ' + esc(trendWord) + (checks !== undefined ? ' (' + checks + ' of 4 daily checks bullish)' : '') + '. ' + esc(biasText) + '.');
  if (g.confluence) {
    const cs = g.confluence, a1 = cs.resistance[0], b1 = cs.support[0];
    const tfs = l => l.tfs.join('+');
    const parts = [];
    if (b1) parts.push('below <b>' + zr(b1) + '</b> (' + tfs(b1) + ', ' + Math.abs(b1.dist_pct).toFixed(2) + '% away)');
    if (a1) parts.push('above <b>' + zr(a1) + '</b> (' + tfs(a1) + ', ' + Math.abs(a1.dist_pct).toFixed(2) + '% away)');
    if (parts.length) bl.push('<b>Nearest key levels where timeframes agree:</b> ' + parts.join(' · ') + '.');
  }
  if (sec0) {
    const s = sec0.sup[0], r = sec0.res[0];
    const parts = [];
    if (s) parts.push('nearest support <b>' + zr(s) + '</b> (' + Math.abs(s.dist_pct).toFixed(1) + '% below)');
    if (r) parts.push('nearest resistance <b>' + zr(r) + '</b> (' + Math.abs(r.dist_pct).toFixed(1) + '% above)');
    if (parts.length) bl.push('<b>Where price is:</b> ' + parts.join(', ') + '.');
  }
  const all = [];
  TABS.forEach(t => secs[t[0]].plans.slice(0, 3).forEach(s => all.push({k: t[0], s})));
  const good = all.filter(x => x.s.grade !== 'C' && Math.max(0, ...x.s.targets.map(t => t.r)) >= 2);
  good.sort((p, q) => q.s.score - p.s.score);
  bl.push('<b>Best trades on paper (grade A or B, reward 2R or more):</b> ' + (good.length
    ? good.slice(0, 4).map(x => esc(FRIENDLY[x.s.name] || x.s.name) + ' <span class="sub">(' + TFNAME[x.k] + ', ' + TREND_LABEL[x.s.trend] + ')</span>').join('; ') +
      (good.length > 4 ? '; +' + (good.length - 4) + ' more in the tabs below' : '') + '.'
    : 'none right now.'));
  if (g.account) {
    const withSize = all.filter(x => x.s.size);
    if (withSize.length) {
      const mp = withSize.map(x => x.s.size.micro_pct);
      const lo = Math.min(...mp), hi = Math.max(...mp), rk = withSize[0].s.size.risk_usd;
      const fits = withSize.filter(x => x.s.size.micro_pct <= g.risk_pct * 2).length;
      bl.push('<b>Your account (' + usd(g.account) + ', risking ' + g.risk_pct + '% = ' + usd(rk) + '):</b> ' +
        'one micro gold future (10 oz) would risk ' + (lo < 10 ? lo.toFixed(1) : Math.round(lo)) + '% to ' + Math.round(hi) + '% of the account across these setups' +
        (fits ? '; it stays within twice your limit on ' + fits + ' of ' + withSize.length + ' (the tight intraday stops)' : ', so futures do not fit') + '. ' +
        'Longs can also be sized with a gold ETF or fractional shares; shorts need spot gold or futures.');
    }
  }
  bl.push('<b>Reality check:</b> these zones show where price reacted before. Our 10-year backtest of these setups found no reliable edge, so treat them as a map, not a signal. <a href="#gold-backtest">Open Gold backtest</a>');

  // ---- sections
  function zr(z){ return z.hi - z.lo >= 1 ? usd(z.lo) + '–' + usd(z.hi) : usd(z.mid); }
  const dots = n => '●'.repeat(Math.min(n, 5)) + '○'.repeat(Math.max(0, 5 - Math.min(n, 5)));
  const unitOf = k => TFNAME[k];
  function ladder(s){
    const rows = [];
    s.res.slice().reverse().forEach(z => rows.push(['res', z]));
    rows.push(['now', null]);
    s.sup.forEach(z => rows.push(['sup', z]));
    return '<div class="ladder">' + rows.map(([t, z]) => t === 'now'
      ? '<div class="lad now"><span>NOW ' + usd2(s.last) + '</span><span></span><span></span><span class="sig">1 typical day ≈ ' + usd(s.atr) + '</span></div>'
      : '<div class="lad ' + t + '"><span>' + (t === 'res' ? '▲ ' : '▼ ') + zr(z) + '</span><span class="dots" title="' + z.n + ' signal(s) agree">' + dots(z.n) + '</span><span>' + pctf(z.dist_pct) + '</span><span class="sig">' + esc(z.labels.slice(0, 4).join(', ')) + (z.labels.length > 4 ? ' +' + (z.labels.length - 4) : '') + '</span></div>').join('') + '</div>';
  }
  function setups(s, k){
    const unit = unitOf(k);
    return s.setups.map(x => {
      const buy = x.side === 'long';
      const entry = x.kind === 'pullback'
        ? 'limit order in ' + usd(x.zone[0]) + (x.zone[1] - x.zone[0] >= 1 ? '–' + usd(x.zone[1]) : '')
        : unit + ' close ' + (buy ? 'above ' : 'below ') + usd(x.level);
      const tg = x.targets.length ? x.targets.map(t => '<div class="' + (t.r >= 2 ? 'r-good' : t.r >= 1.5 ? 'r-ok' : 'r-thin') + '">' + usd(t.price) + ' · ' + t.r.toFixed(1) + 'R' + (t.r < 1.5 ? ' (thin)' : '') + '</div>').join('') : '<div class="r-thin">no level beyond</div>';
      let size = '<span class="sub">enter an account size</span>';
      if (x.size) {
        const z = x.size;
        size = (buy ? (z.etf_capped ? 'Stop is tight: even the whole account in a gold ETF risks only ' + usd(z.etf_risk) + '<br>'
                                    : 'Risk ' + usd(z.risk_usd) + ' → hold about <b>' + usd(z.etf_usd) + '</b> of gold ETF (' + Math.round(z.etf_pct) + '% of account)<br>')
                    : 'Short via spot/CFD only (no unleveraged option)<br>') +
          '<span class="sub">1 oz spot risks ' + usd(z.one_oz_risk) + ' (' + z.one_oz_pct.toFixed(1) + '%) · 1 micro future ' + Math.round(z.micro_pct) + '%</span>';
      }
      const best = Math.max(0, ...x.targets.map(t => t.r));
      return '<div class="sc' + (best < 1.5 ? ' dim' : '') + '"><div class="top"><span class="badge2 ' + (buy ? 'buy' : 'sell') + '">' + (buy ? 'BUY' : 'SELL') + '</span>' +
        '<span class="name">' + esc(FRIENDLY[x.name] || x.name) + '</span>' +
        '<span class="chip ' + (x.trend === 'with' ? 'on' : '') + '">' + TREND_LABEL[x.trend] + '</span>' +
        (x.weak ? '<span class="chip">weak zone</span>' : '') + '</div>' +
        '<div class="grid"><div><div class="k">Enter</div><div class="v">' + esc(entry) + '</div></div>' +
        '<div><div class="k">Stop (idea is wrong)</div><div class="v">' + usd(x.stop) + ' <span class="sub">risk ' + usd(x.risk_per_oz) + '/oz</span></div></div>' +
        '<div><div class="k">Targets · reward</div><div class="v">' + tg + '</div></div>' +
        '<div><div class="k">Size for your risk</div><div class="v">' + size + '</div></div></div></div>';
    }).join('');
  }
  function plan(x, s, k){
    const buy = x.side === 'long';
    const p0 = Math.min(x.stop, x.entry, x.targets[x.targets.length - 1].price, s.last) , p1 = Math.max(x.stop, x.entry, x.targets[x.targets.length - 1].price, s.last);
    const span = (p1 - p0) || 1, pos = v => (4 + (v - p0) / span * 92).toFixed(1) + '%';
    const mk = [['s', x.stop, 'STOP'], ['e', x.entry, 'ENTRY']].concat(x.targets.map((t, i) => ['t', t.price, 'T' + (i + 1)])).concat([['n', s.last, 'NOW']]);
    const track = '<div class="ptrack">' + mk.map(m => '<i class="' + m[0] + '" style="left:' + pos(m[1]) + '"></i><b class="' + m[0] + '" style="left:' + pos(m[1]) + '">' + m[2] + '</b>').join('') + '</div>';
    const tg = x.targets.map((t, i) => '<div class="' + (t.r >= 2 ? 'r-good' : t.r >= 1.5 ? 'r-ok' : 'r-thin') + '">T' + (i + 1) + ' ' + usd2(t.price) + ' · ' + t.r.toFixed(1) + 'R' +
      '<span class="sub"> · ' + Math.round(x.split[i] * 100) + '% off' + (t.src === 'measured' ? ' · measured' : '') + '</span></div>').join('');
    let size = '<span class="sub">enter an account size</span>';
    if (x.size) {
      const z = x.size;
      size = (buy ? (z.etf_capped ? 'Whole account in gold ETF risks only ' + usd(z.etf_risk) + '<br>' : 'Risk ' + usd(z.risk_usd) + ' → about <b>' + usd(z.etf_usd) + '</b> of gold ETF (' + Math.round(z.etf_pct) + '%)<br>')
                    : 'Short via spot/CFD only<br>') +
        '<span class="sub">1 oz risks ' + usd(z.one_oz_risk) + ' (' + z.one_oz_pct.toFixed(1) + '%) · 1 micro ' + Math.round(z.micro_pct) + '%</span>';
    }
    const cls = x.status === 'WAIT' ? '' : x.status === 'NEAR' ? ' near' : ' hot';
    const away = x.dist_pct;
    return '<div class="sc plan"><div class="top"><span class="rk">#' + x.rank + '</span><span class="badge2 ' + (buy ? 'buy' : 'sell') + '">' + (buy ? 'BUY' : 'SELL') + '</span>' +
      '<span class="name">' + esc(FRIENDLY[x.name] || x.name) + '</span><span class="grade ' + x.grade + '" title="score ' + x.score + ' of about 8.5">GRADE ' + x.grade + '</span>' +
      '<span class="stt' + cls + '">' + esc(x.status) + (x.status === 'IN THE ZONE' ? '' : ' · ' + Math.abs(away).toFixed(2) + '% ' + (away > 0 ? 'above' : 'below') + ' price') + '</span>' +
      '<span class="chip ' + (x.trend === 'with' ? 'on' : '') + '">' + TREND_LABEL[x.trend] + '</span>' +
      (x.agree.length ? '<span class="chip tk" title="levels from these charts overlap this zone">' + x.agree.join('+') + ' agree</span>' : '') + '</div>' + track +
      '<div class="grid"><div><div class="k">Entry</div><div class="v"><b>' + usd2(x.entry) + '</b> <span class="sub">zone ' + zr({lo: x.entry_zone[0], hi: x.entry_zone[1], mid: x.entry}) + '</span></div></div>' +
      '<div><div class="k">Stop</div><div class="v">' + usd2(x.stop) + ' <span class="sub">risk ' + usd2(x.risk_per_oz) + '/oz</span></div></div>' +
      '<div><div class="k">Targets · reward</div><div class="v">' + tg + '</div></div>' +
      '<div><div class="k">Size for your risk</div><div class="v">' + size + '</div></div></div>' +
      '<div class="pnote"><b>How:</b> ' + esc(x.entry_how) + '</div>' +
      '<div class="pnote sub"><b>Cancel:</b> ' + esc(x.cancel) + ' <b>Manage:</b> after T1 move the stop to entry. All targets hit = ' + x.blend_r.toFixed(1) + 'R. Why here: ' + esc(x.why.join(', ')) + '.</div></div>';
  }
  function sectionHtml(k){
    const s = secs[k];
    if (!s) return '<div class="note">' + esc(g.long_error || 'Not loaded.') + '</div>';
    const top = s.plans.slice(0, 3), rest = s.plans.slice(3);
    return '<div class="g-h">Top ' + top.length + ' trades · ' + TFNAME[k] + ' chart · ranked by zone strength, timeframe agreement, trend, reward and distance</div>' +
      (top.length ? top.map(x => plan(x, s, k)).join('') : '<div class="note">No zone close enough to build a trade.</div>') +
      (rest.length ? '<details class="more"><summary>' + rest.length + ' more trade idea' + (rest.length > 1 ? 's' : '') + ' on this chart</summary>' + rest.map(x => plan(x, s, k)).join('') + '</details>' : '') +

  }

  const tiles =
    '<div class="g-tile"><div class="k">' + esc(g.symbol) + ' last close</div><div class="v">' + usd2(a.last) + '</div><div class="s">delayed · ' + esc(g.currency) + '</div></div>' +
    '<div class="g-tile"><div class="k">Trend</div><div class="v ' + biasCls(sec0 ? sec0.bias : '') + '">' + esc(trendWord) + '</div><div class="s">price vs 20/50/200-day: ' + pctf((a.last / a.sma20 - 1) * 100) + ' / ' + pctf((a.last / a.sma50 - 1) * 100) + ' / ' + pctf((a.last / a.sma200 - 1) * 100) + '</div></div>' +
    '<div class="g-tile"><div class="k">Typical daily move</div><div class="v">' + usd(a.atr14) + '</div><div class="s">' + (a.atr14 / a.last * 100).toFixed(1) + '% of price (ATR 14)</div></div>' +
    '<div class="g-tile"><div class="k">52-week range</div><div class="g-range"><i style="left:calc(' + rangePos.toFixed(1) + '% - 2px)"></i></div><div class="s">' + usd(a.lo52) + ' low · ' + usd(a.hi52) + ' high<br>' + pctf(a.dd) + ' from high</div></div>' +
    '<div class="g-tile"><div class="k">Volatility</div><div class="v">' + (a.vol20 != null ? a.vol20.toFixed(0) + '%' : 'n/a') + '</div><div class="s">20-day annualised · ' + (a.vol_rank != null ? Math.round(a.vol_rank) + 'th percentile' : '') + '</div></div>';

  const first = TABS[0][0];
  const ALLTF = ['15m', '1h', '4h', '1d', '1w'];
  function confPanel(){
    const cs = g.confluence;
    if (!cs) return g.intraday_error ? '<div class="note">' + esc(g.intraday_error) + '</div>' : '';
    const row = (l, t) => '<div class="lad conf ' + t + '"><span>' + (t === 'res' ? '▲ ' : '▼ ') + zr(l) + '</span>' +
      '<span class="tfs">' + ALLTF.map(x => '<span class="tfc' + (l.tfs.includes(x) ? ' on' : '') + '">' + x + '</span>').join('') + '</span>' +
      '<span>' + pctf(l.dist_pct, 2) + '</span><span class="sig">' + esc(l.signals.slice(0, 4).join(', ')) + '</span></div>';
    return '<div class="g-h">Key levels where timeframes agree · lit boxes = that chart has a level here</div><div class="ladder">' +
      cs.resistance.slice().reverse().map(l => row(l, 'res')).join('') +
      '<div class="lad conf now"><span>NOW ' + usd2(cs.price) + '</span><span></span><span></span><span class="sig">delayed quote</span></div>' +
      cs.support.map(l => row(l, 'sup')).join('') + '</div>' +
      ((cs.resistance.length + cs.support.length) ? '' : '<div class="note">No multi-timeframe levels within 5%.</div>');
  }
  $('#result').innerHTML =
    '<div class="g-tiles">' + tiles + '</div>' +
    '<div class="g-bottom"><h4>Bottom line</h4><ul>' + bl.map(x => '<li>' + x + '</li>').join('') + '</ul></div>' +
    confPanel() +
    (TABS.length > 1 ? '<div class="g-tabs">' + TABS.map((t, i) => '<button type="button" data-t="' + t[0] + '"' + (i === 0 ? ' class="on"' : '') + '>' + t[1] + '</button>').join('') + '</div>' : '') +
    '<div id="gsec">' + sectionHtml(first) + '</div>' +
    '<div class="note">Zones come from past swing highs/lows, moving averages, Fibonacci levels and round numbers. Statistics describe the past and do not predict price. Not financial advice.</div>' +
    '<details class="raw"><summary>Full text report</summary><pre>' + esc(g.report) + '</pre></details>';
  const tabs = $('.g-tabs');
  if (tabs) tabs.addEventListener('click', e => {
    const b = e.target.closest('button[data-t]'); if (!b) return;
    tabs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    $('#gsec').innerHTML = sectionHtml(b.dataset.t);
  });
}

function renderBacktest(d){
  const b = JSON.parse(d.stdout), m = b.meta, A = b.all.r1;
  const R = (v, dp = 2) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(dp) + 'R';
  const day = t => new Date(t * 1000).toISOString().slice(0, 10);

  // ---- verdict, in plain words
  const lo = A.avg - A.ci, hi = A.avg + A.ci;
  const kind = lo > 0 ? 'good' : hi < 0 ? 'bad' : 'neutral';
  const head = kind === 'good' ? 'Positive on this history' : kind === 'bad' ? 'Loses money after costs' : 'No reliable edge';
  const why = kind === 'good'
    ? 'Average ' + R(A.avg) + ' per trade, and the whole uncertainty band (' + R(lo) + ' to ' + R(hi) + ') is above zero. Promising, but a backtest is not proof.'
    : kind === 'bad'
    ? 'Average ' + R(A.avg) + ' per trade, and the whole band (' + R(lo) + ' to ' + R(hi) + ') is below zero.'
    : 'Average ' + R(A.avg) + ' per trade. The band (' + R(lo) + ' to ' + R(hi) + ') includes zero, so the result cannot be told apart from luck.';
  const v = [];
  const h1 = b.halves[0].stats, h2 = b.halves[1].stats;
  if (h1 && h2) v.push('<b>Stability:</b> first half of the history ' + R(h1.avg) + ', second half ' + R(h2.avg) + (Math.sign(h1.avg) !== Math.sign(h2.avg) ? ' — the sign flipped, a warning that it is not steady.' : '.'));
  const w = b.groups[0].stats, c = b.groups[1].stats;
  if (w && c) v.push('<b>Trend filter:</b> trades with the trend averaged ' + R(w.avg) + ', against the trend ' + R(c.avg) + '.');
  const bl = b.baseline.long, bs = b.baseline.short;
  if (bl && bs) v.push('<b>Versus noise:</b> entering at random with no zones made ' + R(bl.avg) + ' (long) and ' + R(bs.avg) + ' (short). Gold rose ' + Math.round(m.buy_hold) + '% over the span, so long trades had a tailwind.');
  v.push('<b>Cost of trading:</b> $' + m.cost.toFixed(2) + ' per ounce is charged on every trade. Trades overlap in time, so the band is on the optimistic side.');

  const kpi = (k, val, sub) => '<div class="g-tile"><div class="k">' + k + '</div><div class="v">' + val + '</div><div class="s">' + sub + '</div></div>';
  const kpis = '<div class="g-tiles">' +
    kpi('Trades', A.n, m.first + ' to ' + m.last) +
    kpi('Win rate', Math.round(A.win) + '%', 'a win = any profit') +
    kpi('Average per trade', R(A.avg), '± ' + A.ci.toFixed(2) + 'R (95% band)') +
    kpi('Profit factor', A.pf == null ? '∞' : A.pf.toFixed(2), 'wins ÷ losses; 1.0 = break-even') +
    kpi('Worst losing streak', A.streak, 'trades in a row') + '</div>';

  // ---- equity curve (cumulative R)
  function equity(){
    const cv = b.curve; if (cv.length < 2) return '';
    const W = 680, H = 250, L = 44, Rr = 78, T = 12, B = 26;
    const ys = cv.flatMap(p => [p.r, p.w]).concat([0]);
    let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.08 || 1; y0 -= pad; y1 += pad;
    const step = [1, 2, 5, 10, 20, 25, 50, 100].find(s => (y1 - y0) / s <= 6) || 100;
    const X = i => L + i / (cv.length - 1) * (W - L - Rr), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
    let g = '';
    for (let t = Math.ceil(y0 / step) * step; t <= y1; t += step)
      g += '<line class="' + (t === 0 ? 'zero' : 'grid') + '" x1="' + L + '" x2="' + (W - Rr) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/><text x="' + (L - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + t + 'R</text>';
    const path = k => cv.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[k]).toFixed(1)).join(' ');
    const last = cv[cv.length - 1];
    const dates = [0, Math.floor(cv.length / 2), cv.length - 1].map(i => '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? 'start' : i === cv.length - 1 ? 'end' : 'middle') + '">' + day(cv[i].t) + '</text>').join('');
    return '<svg class="bt-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cumulative result in R over time">' + g +
      '<path class="l-all" d="' + path('r') + '"/><path class="l-with" d="' + path('w') + '"/>' +
      '<text class="tx-all" x="' + (X(cv.length - 1) + 6) + '" y="' + (Y(last.r) + (last.r > last.w ? -4 : 12)) + '">All ' + R(last.r, 0) + '</text>' +
      '<text class="tx-with" x="' + (X(cv.length - 1) + 6) + '" y="' + (Y(last.w) + (last.w >= last.r ? -4 : 12)) + '">With trend ' + R(last.w, 0) + '</text>' + dates + '</svg>' +
      '<div class="bt-legend"><i style="background:var(--ink)"></i>every setup<i style="background:var(--accent)"></i>only trades with the trend</div>';
  }

  // ---- average-R bars with an uncertainty whisker
  function rbars(rows){
    const D = 1.2, X = v => (Math.max(-D, Math.min(D, v)) + D) / (2 * D) * 300;
    return rows.map(r => {
      const s = r.stats;
      if (!s) return '<div class="rb"><div class="rl">' + esc(r.label) + '</div><div class="empty">no trades</div><div></div></div>';
      const l = s.avg - s.ci, h = s.avg + s.ci, cls = l > 0 ? 'pos' : h < 0 ? 'neg' : 'unk';
      const x0 = X(0), x1 = X(s.avg);
      return '<div class="rb"><div class="rl">' + esc(r.label) + (r.sub ? '<div class="sub">' + esc(r.sub) + '</div>' : '') + '</div>' +
        '<svg viewBox="0 0 300 22" class="' + cls + '" preserveAspectRatio="none"><line class="zline" x1="150" x2="150" y1="0" y2="22"/>' +
        '<rect class="bar2" x="' + Math.min(x0, x1).toFixed(1) + '" y="5" width="' + Math.max(1.5, Math.abs(x1 - x0)).toFixed(1) + '" height="12" rx="2"/>' +
        '<line class="wk" x1="' + X(l).toFixed(1) + '" x2="' + X(h).toFixed(1) + '" y1="11" y2="11"/>' +
        '<line class="wk" x1="' + X(l).toFixed(1) + '" x2="' + X(l).toFixed(1) + '" y1="6" y2="16"/><line class="wk" x1="' + X(h).toFixed(1) + '" x2="' + X(h).toFixed(1) + '" y1="6" y2="16"/></svg>' +
        '<div class="rv">' + R(s.avg) + ' <span class="sub">' + Math.round(s.win) + '% win · ' + s.n + ' trades</span></div></div>';
    }).join('') + '<div class="bt-legend">Bar = average result per trade (centre line = break-even). Whisker = 95% uncertainty.' +
      '<i style="background:var(--ok)"></i>clearly profitable<i style="background:var(--bad)"></i>clearly losing<i style="background:var(--mute)"></i>whisker crosses zero: can\'t tell from luck</div>';
  }

  // ---- side x trend heat tiles
  function heat(){
    const sides = ['long', 'short'], trs = [['with', 'with the trend'], ['counter', 'against the trend'], ['range', 'no clear trend']];
    let h = '<div class="heat"><div></div>' + trs.map(t => '<div class="hh">' + t[1] + '</div>').join('');
    sides.forEach(sd => {
      h += '<div class="hr">' + sd.toUpperCase() + '</div>';
      trs.forEach(t => {
        const s = (b.side_trend.find(x => x.side === sd && x.trend === t[0]) || {}).stats;
        if (!s) { h += '<div class="tile2"><div class="n">no trades</div></div>'; return; }
        const a = Math.min(0.55, Math.abs(s.avg) / 0.8 * 0.55);
        const bg = s.avg >= 0 ? 'rgba(11,107,79,' + a.toFixed(2) + ')' : 'rgba(180,35,24,' + a.toFixed(2) + ')';
        h += '<div class="tile2" style="background:' + bg + '"><div class="a">' + R(s.avg) + '</div><div class="n">' + s.n + ' trades · ' + Math.round(s.win) + '% win' + (s.n < 30 ? ' · small sample' : '') + '</div></div>';
      });
    });
    return h + '</div>';
  }

  // ---- outcome histogram
  function histo(){
    const mx = Math.max(...b.hist.map(x => x.n), 1);
    return '<div class="hist">' + b.hist.map((x, i) => '<div class="col">' + x.n + '<b style="height:' + Math.max(2, x.n / mx * 105) + 'px;background:' + (i < 2 ? 'var(--bad)' : i === 2 ? 'var(--mute)' : 'var(--ok)') + '"></b></div>').join('') + '</div>' +
      '<div class="hist-l">' + b.hist.map(x => '<span>' + esc(x.label) + '</span>').join('') + '</div>';
  }

  const setupRows = b.setups.map(s => ({label: FRIENDLY[s.name] || s.name, stats: s.r1}));
  const baseRows = [
    {label: 'These setups (all)', stats: A},
    {label: 'Random long entries', sub: 'no zones, same exits', stats: b.baseline.long},
    {label: 'Random short entries', sub: 'no zones, same exits', stats: b.baseline.short}];
  const grpRows = b.groups.map(g => ({label: g.label, stats: g.stats}));
  const halfRows = b.halves.map(h => ({label: h.label, sub: h.span, stats: h.stats}));
  const fmtp = t => t[0].toUpperCase() + t.slice(1);

  $('#result').innerHTML =
    '<div class="bt-verdict ' + kind + '"><div class="big">' + head + '</div><div>' + why + '</div><ul>' + v.map(x => '<li>' + x + '</li>').join('') + '</ul></div>' +
    kpis +
    '<div class="bt-h">1 · Running result</div><p class="bt-sub">Cumulative profit in R (1R = the amount risked on a trade) as each trade closed. Up and steady is good; flat or falling means no edge.</p>' + equity() +
    '<div class="bt-h">2 · Which setup worked?</div><p class="bt-sub">Exit at the first target.</p>' + rbars(setupRows) +
    '<div class="bt-h">3 · Side and trend</div><p class="bt-sub">Green = made money, red = lost. Longs had a bull-market tailwind; most shorts were against the trend.</p>' + heat() +
    '<div class="bt-h">4 · What separates good trades from bad</div>' + rbars(grpRows) +
    '<div class="bt-h">5 · Does it hold up over time?</div><p class="bt-sub">The same rules, first half of history versus second half.</p>' + rbars(halfRows) +
    '<div class="bt-h">6 · Does it beat doing nothing clever?</div><p class="bt-sub">Entering every time with no zones, same exits and costs. A strategy must beat this by more than its whisker.</p>' + rbars(baseRows) +
    '<div class="bt-h">7 · How trades ended</div><p class="bt-sub">Most trades end at the stop (−1R); winners are fewer but larger. ' + b.hist.reduce((a, x) => a + x.n, 0) + ' trades.</p>' + histo() +
    '<div class="note">Rules: ' + m.window + '-bar working orders, trades held at most ' + m.hold + ' bars, stop checked before target on the same bar, gaps through a stop exit at the open, $' + m.cost.toFixed(2) + '/oz cost. ' +
    'Delayed Yahoo daily bars; the rules were developed looking at this same history. Past results do not predict future ones. Not financial advice.</div>' +
    '<details class="raw"><summary>Full text report</summary><pre>' + esc(b.report) + '</pre></details>';
}

function renderNews(d){
  const data = JSON.parse(d.stdout);

  const tickers = [...new Set(items.map(i => i.ticker))];
  const tags = [...new Set(items.flatMap(i => i.tags || []))];
  const state = {q: '', tag: '', ticker: '', kind: ''};
  const kinds = [...new Set(items.map(i => i.kind))];
  $('#result').innerHTML =
    '<div class="sub">' + items.length + ' items · checked ' + esc(new Date(data.checked).toLocaleString()) + '</div>' +
    '<div class="bar"><input type="text" id="nq" placeholder="Filter headlines…" autocomplete="off">' +
    (tickers.length > 1 ? tickers.map(t => '<button type="button" class="chip" data-k="ticker" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('') : '') +
    tags.map(t => '<button type="button" class="chip tag-' + esc(t) + '" data-k="tag" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('') +
    (kinds.length > 1 ? kinds.map(t => '<button type="button" class="chip" data-k="kind" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('') : '') +
    '</div><ul class="news" id="nl"></ul>' +
    notes.map(n => '<div class="note">' + esc(n) + '</div>').join('') +
    '<div class="note">Headlines are leads, not facts. Open the story before acting. Not financial advice.</div>' +
    '<details class="raw"><summary>Raw output</summary><pre>' + esc(d.stdout) + '</pre></details>';
  const draw = () => {
    const q = state.q.toLowerCase();
    const rows = items.filter(i => (!q || (i.title + ' ' + (i.summary || '')).toLowerCase().includes(q)) &&
      (!state.tag || (i.tags || []).includes(state.tag)) && (!state.ticker || i.ticker === state.ticker) &&
      (!state.kind || i.kind === state.kind));
    $('#nl').innerHTML = rows.length ? rows.map((i, n) => {
      const url = safeUrl(i.link);
      return '<li class="item' + (i.new ? ' is-new' : '') + '"><div class="meta">' +
        '<span class="chip tk">' + esc(i.ticker) + '</span>' +
        (i.kind && i.kind !== 'headline' ? '<span class="chip tk">' + esc(i.kind) + '</span>' : '') +
        (i.tags || []).map(t => '<span class="chip tag-' + esc(t) + '">' + esc(t) + '</span>').join('') +
        '<span>' + esc(i.source || '') + '</span><span title="' + esc(i.time) + '">· ' + esc(ago(i.time)) + '</span></div>' +
        (url ? '<a class="t" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + '</a>' : '<span class="t">' + esc(i.title) + '</span>') +
        (i.summary ? '<p class="sum" id="s' + n + '">' + esc(i.summary) + '</p><button type="button" class="more" data-s="s' + n + '">more</button>' : '') + '</li>';
    }).join('') : '<li class="note">Nothing matches.</li>';
  };
  $('#nq').addEventListener('input', e => { state.q = e.target.value; draw(); });
  $('#result').addEventListener('click', e => {
    const c = e.target.closest('.chip[data-k]');
    if (c) { const k = c.dataset.k, v = c.dataset.v; state[k] = state[k] === v ? '' : v;
      document.querySelectorAll('.chip[data-k="' + k + '"]').forEach(x => x.classList.toggle('on', state[k] === x.dataset.v)); draw(); }
    const m = e.target.closest('.more');
    if (m) { const s = document.getElementById(m.dataset.s); const open = s.classList.toggle('open'); m.textContent = open ? 'less' : 'more'; }
  });
  draw();
}

function renderGoldNews(d){
  const g = JSON.parse(d.stdout), p = g.pressure, mk = g.market;
  const sg = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2);
  const cls = v => v > 0.05 ? 'gn-up' : v < -0.05 ? 'gn-dn' : 'gn-fl';
  const pcls = p.score >= 10 ? 'gn-up' : p.score <= -10 ? 'gn-dn' : 'gn-fl';
  const pos = Math.max(2, Math.min(98, 50 + p.score / 2));
  const tile = (k, v, s, c) => '<div class="gn-tile"><div class="k">' + esc(k) + '</div><div class="v ' + c + '">' + v + '</div><div class="s">' + s + '</div></div>';
  let tiles = '';
  if (mk) {
    tiles += tile('Gold (GC=F)', usd2(mk.gold.last), '<span class="' + cls(mk.gold.day) + '">' + sg(mk.gold.day) + '% today</span> · ' + sg(mk.gold.five) + '% 5d', '');
    mk.links.forEach(l => {
      const day = l.unit === '%' ? sg(l.day) + '%' : (l.day >= 0 ? '+' : '−') + Math.abs(l.day * 100).toFixed(0) + ' bp';
      const five = l.unit === '%' ? sg(l.five) + '%' : (l.five >= 0 ? '+' : '−') + Math.abs(l.five * 100).toFixed(0) + ' bp';
      const val = l.symbol === '^TNX' ? l.last.toFixed(2) + '%' : Math.round(l.last).toLocaleString('en-US');
      // colour by what the move usually means for gold, not by up/down
      const good = l.corr60 == null ? 0 : (l.day * l.corr60);
      tiles += tile(l.name, val, '<span class="' + cls(good) + '">' + day + ' today</span> · ' + five + ' 5d', '');
    });
  }
  const gauge = '<div class="gn-gauge"><div class="k">News pressure on gold · last ' + g.hours + 'h</div>' +
    '<div class="big ' + pcls + '">' + (p.score >= 0 ? '+' : '−') + Math.abs(p.score).toFixed(0) + '</div><div class="lbl ' + pcls + '">' + esc(p.label) + '</div>' +
    '<div class="gn-bar"><i style="left:calc(' + pos.toFixed(1) + '% - 2px)"></i></div><div class="gn-scale"><span>bearish −100</span><span>0</span><span>+100 bullish</span></div>' +
    '<div class="sub" style="margin-top:8px">' + p.n + ' relevant of ' + g.scanned + ' headlines · <span class="gn-up">' + p.bull + ' bullish</span> · <span class="gn-dn">' + p.bear + ' bearish</span> · ' + p.neutral + ' neutral</div></div>';

  const confirm = g.confirm.length ? '<div class="g-h">Does the market agree with the news?</div><ul class="gn-confirm">' +
    g.confirm.map(c => '<li class="' + c[0] + '">' + (c[0] === 'good' ? '✓ ' : c[0] === 'warn' ? '⚠ ' : '· ') + esc(c[1]) + '</li>').join('') + '</ul>' : '';

  const drivers = '<div class="g-h">What is driving it · bars show headline counts: green pushes gold up, red pushes it down</div><div class="gn-drivers">' +
    g.drivers.map(x => {
      const t = x.bull + x.bear + x.mixed;
      const w = n => t ? (n / t * 100).toFixed(1) + '%' : '0';
      return '<div class="gn-drv' + (t ? '' : ' off') + '"><div class="nm"><span>' + esc(x.name) + '</span><span class="sub">' + (t ? x.bull + '▲ ' + x.bear + '▼' + (x.mixed ? ' ' + x.mixed + '◆' : '') : 'quiet') + '</span></div>' +
        '<div class="gn-split"><b class="u" style="width:' + w(x.bull) + '"></b><b class="m" style="width:' + w(x.mixed) + '"></b><b class="d" style="width:' + w(x.bear) + '"></b></div>' +
        '<div class="why">' + esc(x.why) + '</div></div>';
    }).join('') + '</div>';

  let links = '';
  if (mk && mk.links.length) {
    const cell = c => c.mean == null ? '<span class="sub">too few days</span>' : '<b class="' + cls(c.mean) + '">' + sg(c.mean) + '%</b> <span class="sub">(' + c.n + ' days)</span>';
    const meaning = l => {
      const c = l.corr60;
      if (c == null) return '';
      const s = Math.abs(c) < 0.2 ? 'Weak link lately' : (c < 0 ? 'Moves opposite gold' : 'Moves with gold');
      return s + (Math.abs(c) >= 0.2 ? (Math.abs(c) >= 0.5 ? ' (strong)' : ' (moderate)') : '');
    };
    links = '<div class="g-h">How gold has reacted to other markets · measured on 2 years of daily moves</div><table class="gn-link"><thead><tr><th>Market</th><th>60-day link</th><th>Gold when it jumps</th><th>Gold when it drops</th><th>Read</th></tr></thead><tbody>' +
      mk.links.map(l => {
        const c = l.corr60 == null ? 0 : l.corr60, w = Math.abs(c) * 50;
        const bar = '<span class="gn-corr"><u></u><i style="' + (c >= 0 ? 'left:50%' : 'left:' + (50 - w) + '%') + ';width:' + w + '%;background:' + (c >= 0 ? '#0b6b4f' : '#b42318') + '"></i></span> <span class="sub">' + (l.corr60 == null ? 'n/a' : (c >= 0 ? '+' : '−') + Math.abs(c).toFixed(2)) + '</span>';
        return '<tr><td><b>' + esc(l.name) + '</b></td><td>' + bar + '</td><td>' + cell(l.up) + '</td><td>' + cell(l.down) + '</td><td class="sub">' + meaning(l) + '</td></tr>';
      }).join('') + '</tbody></table><div class="note">"Jumps" and "drops" mean a daily move of more than half its usual size. Correlation runs from −1 (opposite) to +1 (together); it changes over time.</div>';
  }

  const lean = p.score >= 10 ? 1 : p.score <= -10 ? -1 : 0;
  const use = '<div class="gn-use"><b>How to use this with your trade plans.</b> ' +
    (lean > 0 ? 'News leans bullish: it adds weight to BUY plans graded A or B on the Gold assessment and argues against fading rallies. ' :
     lean < 0 ? 'News leans bearish: it adds weight to SELL plans graded A or B and argues for caution on BUY dips. ' :
     'News is balanced: let the price levels and trade grades lead, and do not size up on news alone. ') +
    'News never moves your stop. Headlines that hit price already show up in the move, so avoid chasing a spike; wait for the plan\'s entry. <a href="#gold">Open Gold assessment</a></div>';

  const heads = g.headlines;
  const state = {f: 'all'};
  const draw = () => {
    const rows = heads.filter(h => state.f === 'all' || (state.f === 'high' ? h.impact === 'high' : h.direction === state.f));
    $('#gnl').innerHTML = rows.length ? rows.map(h => {
      const url = safeUrl(h.link);
      return '<li class="' + h.direction + '"><div class="meta"><span class="gn-dir ' + h.direction + '">' + h.direction.toUpperCase() + ' ' + (h.score >= 0 ? '+' : '−') + Math.abs(h.score).toFixed(1) + '</span>' +
        '<span class="chip tk">' + h.impact + ' impact</span>' +
        h.drivers.map(x => '<span class="chip">' + esc(x.name) + (x.dir === 'mixed' ? ' ◆' : x.dir === 'bull' ? ' ▲' : ' ▼') + '</span>').join('') +
        '<span>' + esc(h.source || '') + ' · ' + esc(timeAgo(h.time)) + '</span></div>' +
        (url ? '<a class="t" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(h.title) + '</a>' : '<span class="t">' + esc(h.title) + '</span>') + '</li>';
    }).join('') : '<li class="note">Nothing matches.</li>';
  };
  $('#result').innerHTML =
    '<div class="sub">checked ' + esc(new Date(g.checked * 1000).toLocaleString()) + ' · delayed prices · headlines from Yahoo Finance and Google News</div>' +
    '<div class="gn-top">' + gauge + '<div class="gn-tiles">' + tiles + '</div></div>' + confirm + use + drivers + links +
    '<div class="g-h">Headlines ranked by likely impact on gold</div><div class="bar">' +
    [['all', 'All'], ['high', 'High impact'], ['bullish', 'Bullish'], ['bearish', 'Bearish'], ['neutral', 'Neutral']].map(f => '<button type="button" class="chip' + (f[0] === 'all' ? ' on' : '') + '" data-gf="' + f[0] + '">' + f[1] + '</button>').join('') +
    '</div><ul class="gn-hl" id="gnl"></ul>' +
    g.errors.map(e => '<div class="note">' + esc(e) + '</div>').join('') +
    '<div class="note">Scores come from keyword rules that read wording, not meaning (they can miss sarcasm, negation and context). Headlines are leads, not facts. Correlations describe the past. Not financial advice.</div>';
  $('#result').onclick = e => {                       // onclick, so a re-run replaces the old handler
    const b = e.target.closest('button[data-gf]'); if (!b) return;
    state.f = b.dataset.gf;
    document.querySelectorAll('button[data-gf]').forEach(x => x.classList.toggle('on', x === b)); draw();
  };
  draw();
}

async function watchApi(action, extra){
  const r = await fetch('/api/gold/watch', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(Object.assign({action}, extra || {}))});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'error');
  return d;
}
function beep(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  } catch (e) { /* sound is optional */ }
}
function timeAgo(sec){
  const m = Math.round((Date.now() / 1000 - sec) / 60);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago';
}

      '<button class="chip" type="button" id="al_stop">Stop</button>' +
      '<button class="chip" type="button" id="al_check">Check now</button>' +
      '<button class="chip" type="button" id="al_test">Send test alert</button>' +
      '<button class="chip" type="button" id="al_perm">Allow browser notifications</button>' +
      '<button class="chip" type="button" id="al_clear">Clear feed</button></div>' +
    '<div class="g-h">Right now · nearest key level above and below, in each chart\'s own ATR (highlighted = inside your alert distance)</div><div id="alsnap" class="note">Press Check now or Start watching.</div>' +
    '<div class="g-h">Alerts</div><div class="feed" id="alfeed"></div>' +
    '<div class="note">Rules: on each ticked timeframe an alert fires when price is within your ATR distance of (1) a key level, meaning a price area where two or more timeframes line up or three-plus levels stack on a 1h+ chart, or (2) a setup\'s entry zone or breakout trigger. Each rule fires once, then re-arms after price moves away, and waits at least 30 min (15m), 90 min (1h) or 4 h (4h) between repeats. A breakout alert means the trigger is near or touched; the setup still needs the candle close. Quotes are delayed, so alerts are leads, not signals. Not financial advice.</div>' +
    '</div>';
  let formLoaded = false;
  const readForm = () => ({
    symbol: $('#al_symbol').value,
    tfs: ['15m', '1h', '4h'].filter(t => $('#al_' + t).checked),
    near_atr: parseFloat($('#al_near').value),
    poll_min: parseInt($('#al_poll').value, 10),
    toast: $('#al_toast').checked
  });
  const fillForm = s => {
    $('#al_symbol').value = s.symbol; ['15m', '1h', '4h'].forEach(t => $('#al_' + t).checked = s.tfs.includes(t));
    $('#al_near').value = s.near_atr; $('#al_poll').value = String(s.poll_min); $('#al_toast').checked = s.toast;
  };
  const render = st => {
    if (!formLoaded) { fillForm(st.settings); formLoaded = true; }
    $('#alstat').innerHTML = '<span class="pill ' + (st.running ? 'on' : '') + '">' + (st.running ? 'Watching' : 'Stopped') + '</span>' +
      (st.snapshot ? '<span><b>' + usd2(st.snapshot.price) + '</b> <span class="sub">last 15m close, delayed</span></span>' : '') +
      (st.last_check ? '<span class="sub">checked ' + timeAgo(st.last_check) + '</span>' : '') +
      (st.running && st.next_check ? '<span class="sub">next in ' + Math.max(0, Math.round((st.next_check - st.now) / 60)) + ' min</span>' : '') +
      (st.error ? '<span class="g-down">Last error: ' + esc(st.error) + '</span>' : '');
    const near = st.settings.near_atr;
    const cell = (l) => {
      if (!l) return '<td>none within 5%</td>';
      const hot = l.dist_atr <= near;
      return '<td class="' + (hot ? 'hot' : '') + '">' + (l.hi - l.lo >= 1 ? usd(l.lo) + '–' + usd(l.hi) : usd(l.mid)) +
        '<div class="sub">' + esc(l.tfs.join('+')) + ' · ' + (l.dist === 0 ? 'inside' : l.dist_atr.toFixed(1) + ' ATR') + '</div></td>';
    };
    $('#alsnap').innerHTML = st.snapshot
      ? '<table class="snap"><tr><th>Chart</th><th>Bias</th><th>1 ATR</th><th>Key level above</th><th>Key level below</th></tr>' +
        st.snapshot.rows.map(r => '<tr><td><b>' + r.tf + '</b></td><td class="' + (r.bias === 'bearish' ? 'g-down' : r.bias === 'bullish' ? 'g-up' : 'g-flat') + '">' + r.bias + '</td><td>' + usd2(r.atr) + '</td>' + cell(r.above) + cell(r.below) + '</tr>').join('') + '</table>'
      : 'Press Check now or Start watching.';
    $('#alfeed').innerHTML = st.alerts.length ? st.alerts.map(a =>
      '<div class="al ' + esc(a.kind || '') + '"><div class="m"><span class="chip tk">' + esc(a.tf) + '</span> ' + esc(new Date(a.ts).toLocaleString()) + (a.price ? ' · ' + usd2(a.price) : '') + '</div>' +
      '<div class="t">' + esc(a.title) + '</div><div class="b">' + esc(a.body) + '</div></div>').join('')
      : '<div class="note">No alerts yet.</div>';
    // new alerts since the last look: desktop notification + sound (only after the first load)
    const maxId = st.alerts.length ? Math.max(...st.alerts.map(a => a.id || 0)) : 0;
    if (lastAlertId !== null && maxId > lastAlertId) {
      const fresh = st.alerts.filter(a => (a.id || 0) > lastAlertId).slice(0, 3);
      beep();
      if ('Notification' in window && Notification.permission === 'granted')
        fresh.forEach(a => { try { new Notification(a.title, {body: a.body}); } catch (e) { /* ignore */ } });
    }
    lastAlertId = maxId;
  };
  const refresh = async () => { try { render(await (await fetch('/api/gold/watch')).json()); } catch (e) { /* server busy */ } };
  const act = async (action, extra, label) => {
    const btn = label && $('#' + label); if (btn) btn.disabled = true;
    try { render(await watchApi(action, extra)); } catch (e) { $('#alstat').insertAdjacentHTML('beforeend', '<span class="g-down">' + esc(e.message) + '</span>'); }
    if (btn) btn.disabled = false;
  };
  $('#al_start').onclick = () => { beep(); act('start', {settings: readForm()}, 'al_start'); };
  $('#al_stop').onclick = () => act('stop');
  $('#al_check').onclick = () => act('check', {}, 'al_check');
  $('#al_test').onclick = () => { beep(); act('test'); };
  $('#al_clear').onclick = () => act('clear');
  $('#al_perm').onclick = async () => {
    if (!('Notification' in window)) { alert('This browser has no notification support.'); return; }
    const p = await Notification.requestPermission();
    $('#al_perm').textContent = p === 'granted' ? 'Browser notifications on' : 'Notifications ' + p;
  };
  ['al_symbol', 'al_15m', 'al_1h', 'al_4h', 'al_near', 'al_poll', 'al_toast'].forEach(id =>
    $('#' + id).addEventListener('change', () => act('settings', {settings: readForm()})));
  if ('Notification' in window && Notification.permission === 'granted') $('#al_perm').textContent = 'Browser notifications on';
  lastAlertId = null;
  refresh();
  alertTimer = setInterval(refresh, 15000);
}

async function showFiles(){
  const d = await (await fetch('/api/files')).json();
  $('#main').innerHTML = '<div class="card"><h3>trader/ files</h3><p>What the skills have written so far (read only).</p>' +
    (d.files.length ? '<div class="files">' + d.files.map(f => '<button data-f="' + esc(f) + '">' + esc(f) + '</button>').join('') + '</div>'
      : '<div class="note">Nothing yet. Run “Build targets” or “Budget sizing” with writing switched on.</div>') +
    '<div id="result"></div></div>';
  $('.files') && $('.files').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    const r = await fetch('/api/file?name=' + encodeURIComponent(b.dataset.f)); const j = await r.json();
    $('#result').innerHTML = '<div class="cmd">trader/' + esc(b.dataset.f) + '</div><pre>' + esc(j.text || j.error) + '</pre>';
  });
}
window.addEventListener('hashchange', () => { if (commands.length) show(location.hash.slice(1) || commands[0].id); });
init();
</script>
</body>
