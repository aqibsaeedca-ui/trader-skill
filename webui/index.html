<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader Console</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16191d;--mute:#667085;--line:#e3e6ea;--accent:#0b6b4f;--accent-ink:#fff;--out:#0f1418;--out-ink:#d7e0e6;--err:#ff9a8a;--ok:#0b6b4f;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0e1114;--panel:#161a1f;--ink:#e8ecef;--mute:#8b96a1;--line:#262c33;--accent:#2fb585;--accent-ink:#06130d;--out:#0a0d10;--out-ink:#cfd8de;--ok:#2fb585;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:16px;margin:0}
.sub{color:var(--mute);font-size:12px}
.ua{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.ua input{width:260px}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
nav{border-right:1px solid var(--line);padding:10px;background:var(--panel);overflow:auto}
nav h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 6px 4px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:6px;cursor:pointer;font:inherit}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent);color:var(--accent-ink)}
main{padding:16px;max-width:980px;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 2px;font-size:15px}
.card p{margin:0 0 10px;color:var(--mute)}
.fields{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
label.check{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
input[type=text],input[type=number],select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;min-width:140px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.run{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:8px 18px;font:inherit;font-weight:600;cursor:pointer}
.run:disabled{opacity:.6;cursor:wait}
.cmd{font:12px ui-monospace,Consolas,monospace;color:var(--mute);margin:10px 0 6px;word-break:break-all}
pre{margin:0;background:var(--out);color:var(--out-ink);border-radius:8px;padding:12px;overflow:auto;max-height:60vh;font:12.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre}
pre.err{color:var(--err);margin-top:8px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.badge.ok{color:var(--ok)}.badge.bad{color:var(--bad)}.badge.warn{color:var(--mute)}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 8px}
.bar input[type=text]{min-width:200px;flex:1}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.tk{color:var(--accent);border-color:var(--accent);cursor:default;background:none}
.chip.tag-earnings{color:#b54708;border-color:#b54708}.chip.tag-deal{color:#175cd3;border-color:#175cd3}.chip.tag-people{color:#6941c6;border-color:#6941c6}
@media (prefers-color-scheme:dark){.chip.tag-earnings{color:#fdb022;border-color:#fdb022}.chip.tag-deal{color:#84caff;border-color:#84caff}.chip.tag-people{color:#b692f6;border-color:#b692f6}}
.news{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.item.is-new{border-left-color:var(--accent)}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:4px}
.item a.t{color:var(--ink);font-weight:600;font-size:14.5px;text-decoration:none}
.item a.t:hover{text-decoration:underline;color:var(--accent)}
.item .sum{margin:5px 0 0;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .sum.open{-webkit-line-clamp:unset}
.item .more{background:none;border:0;color:var(--accent);padding:0;margin-top:3px;cursor:pointer;font:inherit;font-size:12px}
details.raw{margin-top:10px}details.raw summary{cursor:pointer;color:var(--mute);font-size:12px}
.g-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.g-tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.g-tile .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.g-tile .v{font-size:20px;font-weight:700;margin-top:2px}
.g-tile .s{font-size:12px;color:var(--mute)}
.g-up{color:var(--ok)}.g-down{color:var(--bad)}.g-flat{color:var(--mute)}
.g-range{position:relative;height:8px;border-radius:4px;background:var(--line);margin:10px 2px 4px}
.g-range i{position:absolute;top:-3px;width:4px;height:14px;border-radius:2px;background:var(--ink)}
.g-bottom{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin:10px 0 14px;background:var(--bg)}
.g-bottom h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.g-bottom ul{margin:0;padding-left:18px}.g-bottom li{margin:4px 0}
.g-tabs{display:flex;gap:6px;margin:6px 0 10px}
.g-tabs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}
.g-tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.g-h{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 0 6px}
.ladder{display:grid;gap:4px}
.lad{display:grid;grid-template-columns:150px 70px 70px 1fr;gap:8px;align-items:center;padding:6px 10px;border-radius:6px;border-left:4px solid var(--line);background:var(--bg);font-size:13px}
.lad.res{border-left-color:var(--bad)}.lad.sup{border-left-color:var(--ok)}
.lad.now{border-left-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:700}
.lad .dots{letter-spacing:2px;color:var(--accent)}.lad.now .dots{color:inherit}
.lad .sig{color:var(--mute);font-size:11.5px}.lad.now .sig{color:inherit}
.sc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.sc .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.sc .name{font-weight:700}
.badge2{font-size:11px;font-weight:700;padding:2px 9px;border-radius:5px;color:#fff}
.badge2.buy{background:#0b6b4f}.badge2.sell{background:#b42318}
.sc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px}
.sc .grid .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.sc .grid .v{font-size:13.5px}
.r-good{color:var(--ok);font-weight:700}.r-ok{font-weight:600}.r-thin{color:var(--mute)}
.sc.dim{opacity:.6}
@media (max-width:760px){.lad{grid-template-columns:1fr 60px 60px}.lad .sig{grid-column:1/-1}}
.files button{margin:0 6px 6px 0;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}nav h2{width:100%;margin:6px 4px 0}nav button{width:auto}.ua input{width:100%}}
</style>
</head>
<body>
<header>
  <div><h1>Trader Console</h1><div class="sub" id="meta">loading…</div></div>
  <div class="ua"><label style="flex-direction:row;align-items:center;gap:6px">SEC identity
    <input type="text" id="ua" placeholder="Your Name you@example.com" autocomplete="off"></label></div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let commands = [], current = null;

try { $('#ua').value = localStorage.getItem('sec_ua') || ''; } catch(e){}
$('#ua').addEventListener('input', e => { try { localStorage.setItem('sec_ua', e.target.value); } catch(_){} });

async function init(){
  const r = await fetch('/api/commands'); const d = await r.json();
  commands = d.commands;
  $('#meta').textContent = 'Python ' + d.python + ' · running from ' + d.root + ' · no order is ever placed from here';
  const groups = {};
  commands.forEach(c => (groups[c.group] = groups[c.group] || []).push(c));
  $('#nav').innerHTML = Object.entries(groups).map(([g, cs]) =>
    '<h2>' + esc(g) + '</h2>' + cs.map(c => '<button data-id="' + c.id + '">' + esc(c.title) + '</button>').join('')).join('')
    + '<h2>Data</h2><button data-id="_files">trader/ files</button>';
  $('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.id); });
  show(location.hash.slice(1) || commands[0].id);
}

function field(p){
  const id = 'f_' + p.name;
  if (p.kind === 'check')
    return '<label class="check"><input type="checkbox" id="' + id + '"' + (p.default ? ' checked' : '') + '> ' + esc(p.label) + '</label>';
  if (p.kind === 'select')
    return '<label>' + esc(p.label) + '<select id="' + id + '">' +
      p.choices.map(c => '<option' + (c === p.default ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></label>';
  return '<label>' + esc(p.label) + '<input id="' + id + '" type="' + (p.kind === 'number' ? 'number' : 'text') +
    '" step="any" value="' + esc(p.default) + '" autocomplete="off"></label>';
}

function show(id){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  history.replaceState(null, '', '#' + id);
  if (id === '_files') return showFiles();
  current = commands.find(c => c.id === id) || commands[0];
  const c = current;
  $('#main').innerHTML =
    '<div class="card"><h3>' + esc(c.title) + '</h3><p>' + esc(c.help) + '</p>' +
    '<form id="form"><div class="fields">' + c.params.map(field).join('') + '</div>' +
    '<button class="run" type="submit">Run</button></form>' +
    '<div class="cmd" id="cmdline"></div><div id="result"></div></div>';
  $('#form').addEventListener('submit', e => { e.preventDefault(); run(c); });
}

async function run(c){
  const values = {_sec_user_agent: $('#ua').value};
  c.params.forEach(p => { const el = $('#f_' + p.name); values[p.name] = p.kind === 'check' ? el.checked : el.value; });
  const btn = $('.run'); btn.disabled = true; btn.textContent = 'Running…';
  $('#result').innerHTML = ''; $('#cmdline').textContent = '';
  try {
    const r = await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:c.id, values})});
    const d = await r.json();
    if (!r.ok) { $('#result').innerHTML = '<pre class="err">' + esc(d.error || 'error') + '</pre>'; return; }
    $('#cmdline').textContent = '$ ' + d.command;
    if (d.view === 'news' && d.code === 0) { try { return renderNews(d); } catch (e) { /* fall back to raw text */ } }
    if (d.view === 'gold' && d.code === 0) { try { return renderGold(d); } catch (e) { console.error(e); } }
    $('#result').innerHTML =
      '<span class="badge ' + (d.code === 0 ? 'ok' : d.code === 1 ? 'warn' : 'bad') + '">exit ' + d.code + '</span> ' +
      '<span class="sub">' + d.seconds + 's' + (d.code === 1 ? ' · exit 1 is a result for several tools (market closed, order blocked, nothing to do): read the output' : '') + '</span>' +
      (d.stdout ? '<pre>' + esc(d.stdout) + '</pre>' : '') +
      (d.stderr ? '<pre class="err">' + esc(d.stderr) + '</pre>' : '') +
      (!d.stdout && !d.stderr ? '<div class="note">No output.</div>' : '');
  } catch (e) {
    $('#result').innerHTML = '<pre class="err">' + esc(e) + '</pre>';
  } finally { btn.disabled = false; btn.textContent = 'Run'; }
}

function ago(iso){
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (isNaN(m)) return '';
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  return Math.round(h / 24) + ' d ago';
}
function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : ''; }

const usd = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const usd2 = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pctf = (n, d = 1) => (n >= 0 ? '+' : '') + n.toFixed(d) + '%';
const FRIENDLY = {
  'LONG on a pullback': 'Buy a dip into support',
  'LONG on a breakout': 'Buy a break above resistance',
  'SHORT on a rally into resistance': 'Sell a rally into resistance',
  'SHORT on a breakdown': 'Sell a break below support'
};
const TREND_LABEL = {with: 'with the trend', counter: 'against the trend', range: 'no clear trend'};

function renderGold(d){
  const g = JSON.parse(d.stdout), a = g.analysis;
  const secs = {short: g.short, long: g.long};
  const sec0 = g.short || g.long;
  const biasCls = b => b === 'bullish' ? 'g-up' : b === 'bearish' ? 'g-down' : 'g-flat';
  const rangePos = a.hi52 > a.lo52 ? Math.min(100, Math.max(0, (a.last - a.lo52) / (a.hi52 - a.lo52) * 100)) : 50;
  const checks = (g.trend_read.match(/\((\d) of 4/) || [])[1];
  const trendWord = g.trend_read.split(' (')[0];

  // ---- bottom line
  const bl = [];
  const biasText = ['short', 'long'].filter(k => secs[k]).map(k => (k === 'short' ? 'Daily chart: ' : 'Weekly chart: ') + secs[k].bias).join(' · ');
  bl.push('<b>Trend:</b> ' + esc(trendWord) + (checks !== undefined ? ' (' + checks + ' of 4 checks bullish)' : '') + '. ' + esc(biasText) + '.');
  if (sec0) {
    const s = sec0.sup[0], r = sec0.res[0];
    const parts = [];
    if (s) parts.push('nearest support <b>' + zr(s) + '</b> (' + Math.abs(s.dist_pct).toFixed(1) + '% below)');
    if (r) parts.push('nearest resistance <b>' + zr(r) + '</b> (' + Math.abs(r.dist_pct).toFixed(1) + '% above)');
    if (parts.length) bl.push('<b>Where price is:</b> ' + parts.join(', ') + '.');
  }
  const all = [];
  ['short', 'long'].forEach(k => secs[k] && secs[k].setups.forEach(s => all.push({k, s})));
  const good = all.filter(x => Math.max(0, ...x.s.targets.map(t => t.r)) >= 2);
  bl.push('<b>Setups worth a look on paper (reward 2R or more):</b> ' + (good.length
    ? good.map(x => esc(FRIENDLY[x.s.name] || x.s.name) + ' <span class="sub">(' + (x.k === 'short' ? 'short-term' : 'long-term') + ', ' + TREND_LABEL[x.s.trend] + ')</span>').join('; ') + '.'
    : 'none right now.'));
  if (g.account) {
    const withSize = all.filter(x => x.s.size);
    if (withSize.length) {
      const mp = withSize.map(x => x.s.size.micro_pct);
      const lo = Math.min(...mp), hi = Math.max(...mp), rk = withSize[0].s.size.risk_usd;
      bl.push('<b>Your account (' + usd(g.account) + ', risking ' + g.risk_pct + '% = ' + usd(rk) + '):</b> ' +
        (lo > g.risk_pct * 3 ? 'one micro gold future (10 oz) would risk ' + Math.round(lo) + '% to ' + Math.round(hi) + '% of the account, so futures do not fit. ' : '') +
        'Longs can be sized with a gold ETF or fractional shares; shorts need spot gold, where the smallest lot (1 oz) is the floor.');
    }
  }
  bl.push('<b>Reality check:</b> these zones show where price reacted before. Our 10-year backtest of these setups found no reliable edge, so treat them as a map, not a signal. <a href="#gold-backtest">Open Gold backtest</a>');

  // ---- sections
  function zr(z){ return z.hi - z.lo >= 1 ? usd(z.lo) + '–' + usd(z.hi) : usd(z.mid); }
  const dots = n => '●'.repeat(Math.min(n, 5)) + '○'.repeat(Math.max(0, 5 - Math.min(n, 5)));
  const unitOf = k => k === 'short' ? 'daily' : 'weekly';
  function ladder(s){
    const rows = [];
    s.res.slice().reverse().forEach(z => rows.push(['res', z]));
    rows.push(['now', null]);
    s.sup.forEach(z => rows.push(['sup', z]));
    return '<div class="ladder">' + rows.map(([t, z]) => t === 'now'
      ? '<div class="lad now"><span>NOW ' + usd2(s.last) + '</span><span></span><span></span><span class="sig">1 typical day ≈ ' + usd(s.atr) + '</span></div>'
      : '<div class="lad ' + t + '"><span>' + (t === 'res' ? '▲ ' : '▼ ') + zr(z) + '</span><span class="dots" title="' + z.n + ' signal(s) agree">' + dots(z.n) + '</span><span>' + pctf(z.dist_pct) + '</span><span class="sig">' + esc(z.labels.slice(0, 4).join(', ')) + (z.labels.length > 4 ? ' +' + (z.labels.length - 4) : '') + '</span></div>').join('') + '</div>';
  }
  function setups(s, k){
    const unit = unitOf(k);
    return s.setups.map(x => {
      const buy = x.side === 'long';
      const entry = x.kind === 'pullback'
        ? 'limit order in ' + usd(x.zone[0]) + (x.zone[1] - x.zone[0] >= 1 ? '–' + usd(x.zone[1]) : '')
        : unit + ' close ' + (buy ? 'above ' : 'below ') + usd(x.level);
      const tg = x.targets.length ? x.targets.map(t => '<div class="' + (t.r >= 2 ? 'r-good' : t.r >= 1.5 ? 'r-ok' : 'r-thin') + '">' + usd(t.price) + ' · ' + t.r.toFixed(1) + 'R' + (t.r < 1.5 ? ' (thin)' : '') + '</div>').join('') : '<div class="r-thin">no level beyond</div>';
      let size = '<span class="sub">enter an account size</span>';
      if (x.size) {
        const z = x.size;
        size = (buy ? 'Risk ' + usd(z.risk_usd) + ' → hold about <b>' + usd(z.etf_usd) + '</b> of gold ETF (' + Math.round(z.etf_pct) + '% of account)<br>' : 'Short via spot/CFD only (no unleveraged option)<br>') +
          '<span class="sub">1 oz spot risks ' + usd(z.one_oz_risk) + ' (' + z.one_oz_pct.toFixed(1) + '%) · 1 micro future ' + Math.round(z.micro_pct) + '%</span>';
      }
      const best = Math.max(0, ...x.targets.map(t => t.r));
      return '<div class="sc' + (best < 1.5 ? ' dim' : '') + '"><div class="top"><span class="badge2 ' + (buy ? 'buy' : 'sell') + '">' + (buy ? 'BUY' : 'SELL') + '</span>' +
        '<span class="name">' + esc(FRIENDLY[x.name] || x.name) + '</span>' +
        '<span class="chip ' + (x.trend === 'with' ? 'on' : '') + '">' + TREND_LABEL[x.trend] + '</span>' +
        (x.weak ? '<span class="chip">weak zone</span>' : '') + '</div>' +
        '<div class="grid"><div><div class="k">Enter</div><div class="v">' + esc(entry) + '</div></div>' +
        '<div><div class="k">Stop (idea is wrong)</div><div class="v">' + usd(x.stop) + ' <span class="sub">risk ' + usd(x.risk_per_oz) + '/oz</span></div></div>' +
        '<div><div class="k">Targets · reward</div><div class="v">' + tg + '</div></div>' +
        '<div><div class="k">Size for your risk</div><div class="v">' + size + '</div></div></div></div>';
    }).join('');
  }
  function sectionHtml(k){
    const s = secs[k];
    if (!s) return '<div class="note">' + esc(g.long_error || 'Not loaded.') + '</div>';
    return '<div class="g-h">Price ladder · ' + (k === 'short' ? 'daily chart' : 'weekly chart') + ' · more dots = more signals agree</div>' + ladder(s) +
      '<div class="g-h">Scenarios · only if price actually gets there · greyed = reward under 1.5R</div>' + setups(s, k);
  }

  const tiles =
    '<div class="g-tile"><div class="k">' + esc(g.symbol) + ' last close</div><div class="v">' + usd2(a.last) + '</div><div class="s">delayed · ' + esc(g.currency) + '</div></div>' +
    '<div class="g-tile"><div class="k">Trend</div><div class="v ' + biasCls(sec0 ? sec0.bias : '') + '">' + esc(trendWord) + '</div><div class="s">price vs 20/50/200-day: ' + pctf((a.last / a.sma20 - 1) * 100) + ' / ' + pctf((a.last / a.sma50 - 1) * 100) + ' / ' + pctf((a.last / a.sma200 - 1) * 100) + '</div></div>' +
    '<div class="g-tile"><div class="k">Typical daily move</div><div class="v">' + usd(a.atr14) + '</div><div class="s">' + (a.atr14 / a.last * 100).toFixed(1) + '% of price (ATR 14)</div></div>' +
    '<div class="g-tile"><div class="k">52-week range</div><div class="g-range"><i style="left:calc(' + rangePos.toFixed(1) + '% - 2px)"></i></div><div class="s">' + usd(a.lo52) + ' low · ' + usd(a.hi52) + ' high<br>' + pctf(a.dd) + ' from high</div></div>' +
    '<div class="g-tile"><div class="k">Volatility</div><div class="v">' + (a.vol20 != null ? a.vol20.toFixed(0) + '%' : 'n/a') + '</div><div class="s">20-day annualised · ' + (a.vol_rank != null ? Math.round(a.vol_rank) + 'th percentile' : '') + '</div></div>';

  const first = secs.short ? 'short' : 'long';
  $('#result').innerHTML =
    '<div class="g-tiles">' + tiles + '</div>' +
    '<div class="g-bottom"><h4>Bottom line</h4><ul>' + bl.map(x => '<li>' + x + '</li>').join('') + '</ul></div>' +
    (secs.short && secs.long ? '<div class="g-tabs"><button type="button" data-t="short" class="on">Short term (days–weeks)</button><button type="button" data-t="long">Long term (weeks–months)</button></div>' : '') +
    '<div id="gsec">' + sectionHtml(first) + '</div>' +
    '<div class="note">Zones come from past swing highs/lows, moving averages, Fibonacci levels and round numbers. Statistics describe the past and do not predict price. Not financial advice.</div>' +
    '<details class="raw"><summary>Full text report</summary><pre>' + esc(g.report) + '</pre></details>';
  const tabs = $('.g-tabs');
  if (tabs) tabs.addEventListener('click', e => {
    const b = e.target.closest('button[data-t]'); if (!b) return;
    tabs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    $('#gsec').innerHTML = sectionHtml(b.dataset.t);
  });
}

function renderNews(d){
  const data = JSON.parse(d.stdout);
  const items = data.items || [], notes = data.notes || [];
  const tickers = [...new Set(items.map(i => i.ticker))];
  const tags = [...new Set(items.flatMap(i => i.tags || []))];
  const state = {q: '', tag: '', ticker: '', kind: ''};
  const kinds = [...new Set(items.map(i => i.kind))];
  $('#result').innerHTML =
    '<div class="sub">' + items.length + ' items · checked ' + esc(new Date(data.checked).toLocaleString()) + '</div>' +
    '<div class="bar"><input type="text" id="nq" placeholder="Filter headlines…" autocomplete="off">' +
    (tickers.length > 1 ? tickers.map(t => '<button type="button" class="chip" data-k="ticker" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('') : '') +
    tags.map(t => '<button type="button" class="chip tag-' + esc(t) + '" data-k="tag" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('') +
    (kinds.length > 1 ? kinds.map(t => '<button type="button" class="chip" data-k="kind" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('') : '') +
    '</div><ul class="news" id="nl"></ul>' +
    notes.map(n => '<div class="note">' + esc(n) + '</div>').join('') +
    '<div class="note">Headlines are leads, not facts. Open the story before acting. Not financial advice.</div>' +
    '<details class="raw"><summary>Raw output</summary><pre>' + esc(d.stdout) + '</pre></details>';
  const draw = () => {
    const q = state.q.toLowerCase();
    const rows = items.filter(i => (!q || (i.title + ' ' + (i.summary || '')).toLowerCase().includes(q)) &&
      (!state.tag || (i.tags || []).includes(state.tag)) && (!state.ticker || i.ticker === state.ticker) &&
      (!state.kind || i.kind === state.kind));
    $('#nl').innerHTML = rows.length ? rows.map((i, n) => {
      const url = safeUrl(i.link);
      return '<li class="item' + (i.new ? ' is-new' : '') + '"><div class="meta">' +
        '<span class="chip tk">' + esc(i.ticker) + '</span>' +
        (i.kind && i.kind !== 'headline' ? '<span class="chip tk">' + esc(i.kind) + '</span>' : '') +
        (i.tags || []).map(t => '<span class="chip tag-' + esc(t) + '">' + esc(t) + '</span>').join('') +
        '<span>' + esc(i.source || '') + '</span><span title="' + esc(i.time) + '">· ' + esc(ago(i.time)) + '</span></div>' +
        (url ? '<a class="t" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + '</a>' : '<span class="t">' + esc(i.title) + '</span>') +
        (i.summary ? '<p class="sum" id="s' + n + '">' + esc(i.summary) + '</p><button type="button" class="more" data-s="s' + n + '">more</button>' : '') + '</li>';
    }).join('') : '<li class="note">Nothing matches.</li>';
  };
  $('#nq').addEventListener('input', e => { state.q = e.target.value; draw(); });
  $('#result').addEventListener('click', e => {
    const c = e.target.closest('.chip[data-k]');
    if (c) { const k = c.dataset.k, v = c.dataset.v; state[k] = state[k] === v ? '' : v;
      document.querySelectorAll('.chip[data-k="' + k + '"]').forEach(x => x.classList.toggle('on', state[k] === x.dataset.v)); draw(); }
    const m = e.target.closest('.more');
    if (m) { const s = document.getElementById(m.dataset.s); const open = s.classList.toggle('open'); m.textContent = open ? 'less' : 'more'; }
  });
  draw();
}

async function showFiles(){
  const d = await (await fetch('/api/files')).json();
  $('#main').innerHTML = '<div class="card"><h3>trader/ files</h3><p>What the skills have written so far (read only).</p>' +
    (d.files.length ? '<div class="files">' + d.files.map(f => '<button data-f="' + esc(f) + '">' + esc(f) + '</button>').join('') + '</div>'
      : '<div class="note">Nothing yet. Run “Build targets” or “Budget sizing” with writing switched on.</div>') +
    '<div id="result"></div></div>';
  $('.files') && $('.files').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    const r = await fetch('/api/file?name=' + encodeURIComponent(b.dataset.f)); const j = await r.json();
    $('#result').innerHTML = '<div class="cmd">trader/' + esc(b.dataset.f) + '</div><pre>' + esc(j.text || j.error) + '</pre>';
  });
}
window.addEventListener('hashchange', () => { if (commands.length) show(location.hash.slice(1) || commands[0].id); });
init();
</script>
